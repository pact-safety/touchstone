# A `request` block is merged into every call body; `provider` pins one OpenRouter provider and precision so every call hits the same weights, with fallbacks off.
# Models the automated assessor may use. Only open-weights models under an OSI-approved licence
# are allowed, so anyone can download the same weights and audit or repeat a run.
# An assessment whose model_run.model is not listed here fails validation.
# `id` is the name the provider uses; the same weights can appear under several providers.
allowed:
  - id: qwen3:8b
    provider: ollama
    license: Apache-2.0
    weights: https://huggingface.co/Qwen/Qwen3-8B
    note: The nightly default. Fits a standard GitHub Actions runner (16 GB RAM, CPU only), so it needs no account or key.
  - id: gpt-oss:20b
    provider: ollama
    license: Apache-2.0
    weights: https://huggingface.co/openai/gpt-oss-20b
    note: Stronger, but needs more than a standard runner's 16 GB; use a larger or self-hosted runner.
  - id: gpt-oss:120b
    provider: ollama
    license: Apache-2.0
    weights: https://huggingface.co/openai/gpt-oss-120b
    note: Needs about 65 GB of memory; for a self-hosted runner.
  - id: openai/gpt-oss-120b
    provider: openai-compatible (OpenRouter, Groq, Hugging Face)
    license: Apache-2.0
    weights: https://huggingface.co/openai/gpt-oss-120b
    note: Hosted; set TOUCHSTONE_LLM_BASE_URL and the TOUCHSTONE_LLM_API_KEY secret.
    base_url: https://openrouter.ai/api/v1
    request:
      provider: {only: [deepinfra], quantizations: [bf16], allow_fallbacks: false, require_parameters: true, zdr: true, data_collection: deny}
      reasoning: {effort: low}
  - id: qwen2.5:14b-instruct
    provider: ollama
    license: Apache-2.0
    weights: https://huggingface.co/Qwen/Qwen2.5-14B-Instruct
  - id: google/gemma-4-31b-it
    provider: openai-compatible (OpenRouter, pinned to DeepInfra)
    license: Apache-2.0
    weights: https://huggingface.co/google/gemma-4-31B-it
    base_url: https://openrouter.ai/api/v1
    request:
      provider: {only: [deepinfra], quantizations: [fp8], allow_fallbacks: false, require_parameters: true, zdr: true, data_collection: deny}
      reasoning: {enabled: false}
  - id: qwen/qwen3.6-35b-a3b
    provider: openai-compatible (OpenRouter, pinned to DeepInfra)
    license: Apache-2.0
    weights: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
    base_url: https://openrouter.ai/api/v1
    request:
      provider: {only: [deepinfra], quantizations: [fp8], allow_fallbacks: false, require_parameters: true, zdr: true, data_collection: deny}
      reasoning: {enabled: false}
  - id: deepseek/deepseek-v4.1-flash-1017
    provider: openai-compatible (OpenRouter, pinned to DeepInfra)
    license: MIT
    weights: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
    base_url: https://openrouter.ai/api/v1
    request:
      provider: {only: [deepinfra], quantizations: [fp8], allow_fallbacks: false, require_parameters: true, zdr: true, data_collection: deny}
      reasoning: {enabled: false}

# The model the nightly job uses unless TOUCHSTONE_MODEL overrides it.
default: qwen3:8b
