# Agentic Benchmark Checklist (ABC) v1, Zhu et al. 2025.
# Task-validity (T.*) and reporting (R.*) items follow the paper's numbering. Outcome-validity
# items are specific to an evaluation method; each is n/a unless the benchmark uses that method.
# Section score = met / (met + unmet) × 100. Overall = mean of the three section scores, which
# reproduces the paper's published overall figures.
id: abc
name: Agentic Benchmark Checklist
short: ABC
version: "1.0.1"
publisher: Zhu et al. (UIUC Kang Lab and collaborators)
year: 2025
kind: checklist
status: encoded
applies_to: Agentic benchmarks, where an AI agent completes tasks with tools or in an environment.
scope:
  modalities: [lm-agent]
url: https://arxiv.org/abs/2507.02825
citation: >-
  Zhu, Y., Jin, T., Pruksachatkun, Y., et al. (2025). Establishing Best Practices for Building
  Rigorous Agentic Benchmarks. arXiv:2507.02825.
description: >-
  Checks whether a task is solvable if and only if the agent has the target capability (task
  validity), whether the evaluation correctly decides if a task was solved (outcome validity),
  and how transparently limitations are reported.
scoring:
  scheme: checklist
  overall: mean-of-groups
groups:
  - id: outcome_validity
    name: Outcome validity
    description: The evaluation method correctly indicates whether the task has been solved.
    items:
      - id: O.a.1
        principle: String matching (whole or substring)
        text: Considers expressions semantically equivalent to ground truth.
        guidance: { met: "The matcher documents the equivalences it normalises (e.g. case, whitespace, numerals, synonyms) and at least one such equivalent answer is shown to be accepted.", not_applicable: "The benchmark does not score by string matching.", evidence: [repo] }
      - id: O.a.2
        principle: String matching (whole or substring)
        text: Handles redundant words used by agents.
        guidance: { met: "Extra words around a correct answer do not cause a false failure.", not_applicable: "The benchmark does not score by string matching.", evidence: [repo] }
      - id: O.a.3
        principle: String matching (substring)
        text: Handles negation modifiers used by agents.
        guidance: { met: "An answer that negates the ground truth is not scored correct.", not_applicable: "The benchmark does not score by substring matching.", evidence: [repo] }
      - id: O.a.4
        principle: String matching (substring)
        text: Is robust against systematically listing all possible answers.
        guidance: { met: "Listing every candidate answer does not score as correct.", not_applicable: "The benchmark does not score by substring matching.", evidence: [repo] }
      - id: O.a.5
        principle: String matching (substring)
        text: Ground truth is sufficiently complex to prevent guessing.
        guidance: { met: "A generic guess (e.g. \"yes\" or a single digit) is shown, by a test or by the answer set itself, to score incorrect for every item.", not_applicable: "The benchmark does not score by substring matching.", evidence: [dataset] }
      - id: O.b.1
        principle: LLM-as-a-judge
        text: Demonstrates documented or experimental evidence of the judge's accuracy, self-consistency, and agreement with human.
        guidance: { met: "Judge accuracy, self-consistency and human agreement are all reported.", not_applicable: "No LLM judge is used.", evidence: [paper] }
      - id: O.b.2
        principle: LLM-as-a-judge
        text: Is designed to resist adversarial inputs and reward hacking.
        guidance: { met: "Results of adversarial inputs against the judge are reported, or a named defence (e.g. fixed rubric, injection filter) is described.", not_applicable: "No LLM judge is used.", evidence: [paper, repo] }
      - id: O.c.1
        principle: Code generation, unit or end-to-end testing
        text: Verifies test cases for correctness and quality (e.g., by human).
        guidance: { met: "A review step for test cases is documented, stating who reviewed (e.g. human expert, second model) and what share of test cases it covered.", not_applicable: "Outputs are not scored by test cases.", evidence: [paper] }
      - id: O.c.2
        principle: Code generation, unit or end-to-end testing
        text: Measures quality of test cases using objective metrics (e.g., code coverage, cyclomatic complexity control).
        guidance: { met: "Test-suite quality is measured with an objective metric such as coverage.", not_applicable: "Outputs are not scored by test cases.", evidence: [paper, repo] }
      - id: O.d.1
        principle: Code generation, fuzz testing
        text: Addresses potential edge cases.
        guidance: { met: "A list of edge cases exists in the repo or docs and the fuzz generators reference it.", not_applicable: "Fuzz testing is not used.", evidence: [repo] }
      - id: O.d.2
        principle: Code generation, fuzz testing
        text: Ensures comprehensive coverage of all relevant input variations (e.g., data types, memory layouts, value ranges).
        guidance: { met: "The generator config lists the input types and ranges, and every listed type and range is sampled.", not_applicable: "Fuzz testing is not used.", evidence: [repo] }
      - id: O.d.3
        principle: Code generation, fuzz testing
        text: Generates inputs that the code under testing is sensitive to.
        guidance: { met: "The docs name the behaviours the code under test is sensitive to, and the generator targets each of them.", not_applicable: "Fuzz testing is not used.", evidence: [repo] }
      - id: O.e.1
        principle: Code generation, end-to-end testing
        text: Exercises all relevant parts of the code being tested.
        guidance: { met: "A coverage figure for the tested code is reported, or the relevant components are listed and each is shown to be exercised by a test.", not_applicable: "End-to-end testing is not used.", evidence: [repo] }
      - id: O.e.2
        principle: Code generation, end-to-end testing
        text: Prevents non-deterministic ("flaky") test results.
        guidance: { met: "Tests are shown to give the same result on repeat runs.", not_applicable: "End-to-end testing is not used.", evidence: [repo] }
      - id: O.f.1
        principle: State modification, state matching
        text: Ground truth includes all states achievable after success.
        guidance: { met: "The valid end states are enumerated, or the check is a goal predicate rather than a match against one exact state snapshot.", not_applicable: "Outcomes are not scored by matching environment state.", evidence: [repo] }
      - id: O.f.2
        principle: State modification, state matching
        text: Checks relevant and irrelevant states for the challenge.
        guidance: { met: "Scoring also checks that unrelated state was not damaged.", not_applicable: "Outcomes are not scored by matching environment state.", evidence: [repo] }
      - id: O.f.3
        principle: State modification, state matching
        text: Ground truth is complex to prevent trivial state modifications.
        guidance: { met: "A no-op or single-write baseline is shown to fail the check.", not_applicable: "Outcomes are not scored by matching environment state.", evidence: [repo] }
      - id: O.g.1
        principle: Multistep reasoning, answer matching
        text: Specifies required answer formats in challenge descriptions.
        guidance: { met: "Task prompts state the required answer format.", not_applicable: "Answers are not scored by matching a final answer.", evidence: [dataset] }
      - id: O.g.2
        principle: Multistep reasoning, answer matching
        text: Minimizes the possibility of success by random guessing.
        guidance: { met: "The answer-space size is stated together with the resulting chance success rate, or chance-corrected scoring is used.", not_applicable: "Answers are not scored by matching a final answer.", evidence: [dataset, paper] }
      - id: O.h.1
        principle: Multistep reasoning, quality measure
        text: Designs quality metrics that prevent exploitation (e.g., achieving high scores by reward hacking).
        guidance: { met: "At least one exploit attempt against the quality metric, and its result, are reported.", not_applicable: "No continuous quality metric is used.", evidence: [paper, repo] }
  - id: task_validity
    name: Task validity
    description: A task is solvable if and only if the agent possesses the target capability.
    items:
      - id: T.1
        principle: Tool
        text: Versions of all tools (e.g., Python) are clearly specified.
        guidance: { met: "Every tool and package in the task environment has a stated version or a lockfile entry.", evidence: [repo], probe: pinned-dependencies }
      - id: T.2
        principle: Tool
        text: Required API tools are consistently accessible during evaluation.
        guidance: { met: "The harness documents how it handles retries and rate limits for each external API tool.", not_applicable: "No external API tools are used.", evidence: [repo, docs] }
      - id: T.3
        principle: Tool
        text: Evaluation process terminates or handles errors appropriately if an API becomes inaccessible.
        guidance: { met: "API outages are detected and the run stops or the task is excluded, not silently failed.", not_applicable: "No external API tools are used.", evidence: [repo] }
      - id: T.4
        principle: Environment
        text: Residual data or state are fully cleared between runs.
        guidance: { met: "Each task starts from a fresh environment.", evidence: [repo], probe: harness-resets-state }
      - id: T.5
        principle: Environment
        text: Agent is completely isolated from any ground truth information.
        guidance: { met: "The container or harness config shows that answers and tests are absent from the agent's filesystem and not fetchable over its allowed network.", evidence: [repo] }
      - id: T.6
        principle: Environment
        text: Setup does not change over time (e.g., no live website).
        guidance: { met: "The environment is frozen at release (containers, snapshots, local copies).", evidence: [repo] }
      - id: T.7
        principle: Implementation
        text: Annotated ground truth is verified for correctness.
        guidance: { met: "All ground-truth labels, or a stated sample of them, were checked by a second person or by execution.", evidence: [paper] }
      - id: T.8
        principle: Implementation
        text: Each task is verified to be solvable.
        guidance: { met: "Every task was solved by a person or a reference solution.", evidence: [paper, repo] }
      - id: T.9
        principle: Implementation
        text: Benchmark includes an Oracle solver that can automatically solve all challenges.
        guidance: { met: "An automated reference solver ships with the benchmark and solves all tasks.", evidence: [repo], probe: oracle-solver-present }
      - id: T.10
        principle: Implementation
        text: Implementation is free of vulnerabilities that could be exploited to pass evaluations without completing tasks.
        guidance: { met: "Unmet if the sources or an open issue at the pinned commit report an unfixed exploit; met only if an exploit audit of the implementation is documented.", evidence: [paper, repo] }
  - id: benchmark_reporting
    name: Benchmark reporting
    description: Limitations that cannot be avoided are reported transparently.
    items:
      - id: R.1
        principle: Transparency and validity
        text: Is fully or at least partially open-sourced.
        guidance: { met: "Tasks or data are publicly available, in full or in part.", evidence: [repo, dataset] }
      - id: R.2
        principle: Transparency and validity
        text: Offers an open-source evaluation harness for users.
        guidance: { met: "The code that runs and scores the benchmark is public.", evidence: [repo] }
      - id: R.3
        principle: Transparency and validity
        text: Includes measures to prevent data contamination at the time of benchmark release, such as a private, held-out test set.
        guidance: { met: "A private held-out split, a rotating split, or a canary string together with a reported contamination test is described.", evidence: [repo, paper], probe: canary-or-heldout }
      - id: R.4
        principle: Transparency and validity
        text: Includes measures or plans to consistently update challenges over time to avoid overfitting.
        guidance: { met: "A versioned update exists, or a dated update schedule or process is documented.", evidence: [docs, paper] }
      - id: R.5
        principle: Transparency and validity
        text: Clearly states the relationship between the agent capabilities it aims to evaluate and the constructs or outcomes it measures.
        guidance: { met: "A quotable statement names the capability and the outcome measure and says why the measure indicates the capability.", evidence: [paper] }
      - id: R.6
        principle: Transparency and validity
        text: Clearly states the evaluation subject of the benchmark (e.g., a model or an agent framework).
        guidance: { met: "It is stated whether a model, a scaffold, or the pair is being evaluated.", evidence: [paper] }
      - id: R.7
        principle: Flaw mitigation
        text: Describes steps taken to prevent, identify, and correct flaws.
        guidance: { met: "At least one quality-control step and one correction channel with a recorded fix (errata, changelog or versioned release) are described.", evidence: [paper, repo] }
      - id: R.8
        principle: Flaw mitigation
        text: Includes qualitative discussions of the potential impact of unavoidable flaws.
        guidance: { met: "Each known unavoidable flaw is named with its likely direction of effect on results.", evidence: [paper] }
      - id: R.9
        principle: Flaw mitigation
        text: Includes quantitative analysis to assess the impact of unavoidable flaws (e.g., noise of ground truth).
        guidance: { met: "The impact of a known flaw is estimated numerically.", evidence: [paper] }
      - id: R.10
        principle: Result interpretation
        text: Reports metrics about statistical significance, such as confidence intervals.
        guidance: { met: "Every score in the main results table has a confidence interval or significance test.", evidence: [paper] }
      - id: R.11
        principle: Result interpretation
        text: Provides guidance on interpreting results with eval flaws.
        guidance: { met: "A stated caveat attached to named flaws says which conclusions should not be drawn from the results.", evidence: [paper] }
      - id: R.12
        principle: Result interpretation
        text: Reports results of non-AI baselines (e.g., human experts).
        guidance: { met: "A human or expert baseline is reported; random or heuristic baselines count under R.13 only.", evidence: [paper] }
      - id: R.13
        principle: Result interpretation
        text: Reports results of trivial agents (e.g., one that does nothing).
        guidance: { met: "A do-nothing or trivial agent's score is reported.", evidence: [paper] }
