# NIST AI 800-2 ipd (Practices for Automated Benchmark Evaluations of Language Models), initial public draft.
# Encoded from the Jan 2026 draft text. Nine practices in three stages; ids follow the document's numbering
# (1.2.1 = Practice 1.2, item 1; letters/roman numerals are its sub-items).
# RULE: the practices are addressed to evaluators, but Touchstone rates benchmarks. Each item therefore asks
# whether the BENCHMARK supports an evaluator following that practice: documents what it measures, ships what is
# needed to run it reproducibly, and reports what is needed to analyse results. A practice or sub-practice that is
# purely evaluator-side (a benchmark can neither support nor block it) is left out and listed below.
# Left out as evaluator-side: Practice 1.1 (define evaluation objectives, both questions); 1.2.2.a.ii (test item format
# should reflect intended use: fit to the evaluator's use case is the evaluator's judgement; the benchmark-side part, stating
# the format, is 1.2.1c); 1.2.2.b.ii (subject matter expertise: the evaluator integrates expert analysis; the benchmark-side
# evidence is 1.2.2b); 1.2.5b (results reported by others); 2.1.1 principle 2 (external validity: designing the protocol to mirror an external context is the evaluator's choice;
# the benchmark-side settings are 2.1.2a and 2.1.2c); 2.1.2 safeguards/filters and model provider settings; 2.2 on its own, "choose an evaluation
# framework" (folded into 2.2.1 as shipped code); 2.3.4 and 2.3.5 (tag and group evaluation logs); 2.4.1.1 degraded
# serving, 2.4.1.2 tool calling errors, 2.4.1.6 evaluation awareness; 2.4.2A and 2.4.2B manual/automated transcript
# review; 3.1.1 modelling assumptions, 3.1.4 unquantified variation, 3.1.5 statistical tests for comparisons
# (item-level results, 3.2.2, are what a benchmark can add); 3.2.5 publish evaluation code (the benchmark-side
# version is 2.2.1); 3.3.1 distinguish claim types, 3.3.2b predicting future measurements, 3.3.4 evaluation-awareness
# reporting, 3.3.6 agreement with other evidence.
# Folded: the "cost control" design principle (2.1.1) is covered by the agent budget item (2.1.2e) and cost reporting (3.2.3).
# `principle` is the practice text condensed (lead-ins and cross-references dropped, table labels joined), not a verbatim quote.
# Item ids loosely follow the draft numbering (e.g. 1.2.2a = 1.2.2.a.i); the 2.1.2a-j ids are Touchstone's own.
# Emerging practices are encoded like the rest; the draft labels them and the item text says so.
# Scoring is Touchstone's, the draft publishes none: group = met / (met + unmet) × 100, overall = mean of groups.
id: nist-ai-800-2
name: "NIST AI 800-2: Practices for Automated Benchmark Evaluations of Language Models"
short: NIST AI 800-2
version: "ipd-2026-01"
publisher: NIST Center for AI Standards and Innovation (CAISI)
year: 2026
kind: government-guidance
status: encoded
scoring_defined_by: touchstone
applies_to: >-
  Language-model benchmarks (text-output models, including language-model agents). The draft's practices are
  addressed to evaluators, so each item asks whether the benchmark supports an evaluator following the practice;
  purely evaluator-side practices are left out (see the file header).
scope:
  modalities: [language-model, lm-agent]
url: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.800-2.ipd.pdf
citation: >-
  NIST Center for AI Standards and Innovation (2026). Practices for Automated Benchmark Evaluations of Language
  Models. NIST AI 800-2 ipd (initial public draft). https://doi.org/10.6028/NIST.AI.800-2.ipd
description: >-
  Initial public draft. Nine practices in three stages: define objectives and select benchmarks, implement and run
  evaluations, analyse and report results. Written for evaluators running existing benchmarks rather than for
  benchmark design; here each item asks whether a benchmark supports an evaluator following the practice.
notes: Initial public draft (January 2026), open for comment; practices and numbering may change in the final version, and items will be revised to match.
scoring:
  scheme: checklist
  overall: mean-of-groups
groups:
  - id: select
    name: "Stage 1: Defining objectives and selecting benchmarks"
    description: Practice 1.2 only; Practice 1.1 (define evaluation objectives) is evaluator-side.
    items:
      - { id: 1.2.1, principle: "Document, in detail, precisely what each candidate benchmark measures.", text: "Does the benchmark state precisely what it measures?", guidance: { met: "The documentation names the construct (the capability or behaviour) and the task through which it is measured, specifically enough that a reader could say what falls outside it.", evidence: [paper, docs, repo] } }
      - { id: 1.2.1a, principle: "Subject matter. What topics does the benchmark cover?", text: "Does the benchmark state the topics or subject areas its items cover?", guidance: { met: "The paper or repo lists the specific subject areas or task categories the items cover (a named taxonomy, domain list or per-category breakdown, ideally with item counts), rather than only a general description such as 'broad knowledge'.", evidence: [paper, docs, dataset] } }
      - { id: 1.2.1b, principle: "Difficulty. What is the intended difficulty of the benchmark?", text: "Does the benchmark state the intended difficulty of its items?", guidance: { met: "The intended difficulty or target population is stated (for example, expert level, undergraduate level, tasks taking a human a stated time).", evidence: [paper, docs] } }
      - { id: 1.2.1c, principle: "Test item format. How are the benchmark items formatted?", text: "Does the benchmark state the format of its items?", guidance: { met: "The item format is stated (multiple choice, free response, code task, interactive environment, and so on), with at least one example item shown.", evidence: [paper, docs, dataset] } }
      - { id: 1.2.1d, principle: "Grading. How are responses graded or assessed?", text: "Does the benchmark state how responses are graded?", guidance: { met: "The grading method is stated (exact match, rule-based, execution, LLM judge, human) with enough detail to say what counts as correct.", evidence: [paper, docs, repo] } }
      - { id: 1.2.2a, principle: "Make note of any subject areas or other aspects not covered in the benchmark.", text: "Does the benchmark state what the item set does not cover relative to the construct it names?", guidance: { met: "The documentation names at least one area, setting or task type the construct implies but the items do not cover, or states with reasons that coverage is complete.", evidence: [paper, docs] } }
      - { id: 1.2.2b, principle: "Draw on use cases and threat models of interest to assess the connection between the benchmark content and evaluation objective.", text: "Does the benchmark state which use cases or threat models its results are meant to inform, and whether it measures the construct directly or through a proxy?", guidance: { met: "The documentation names an intended use case or threat model and states whether the benchmark measures the construct directly or a prerequisite, subpart or related task.", evidence: [paper, docs] } }
      - { id: 1.2.2c, principle: "[Emerging Practice] The benchmark predicts downstream outcomes of interest.", text: "Where the benchmark claims its scores predict a downstream outcome, does it cite evidence of that relationship?", guidance: { met: "A correlation or other empirical result linking benchmark scores to the downstream outcome or indicator is reported or cited.", not_applicable: "The benchmark makes no claim that its scores predict any downstream outcome.", evidence: [paper, docs] } }
      - { id: 1.2.3a, principle: "Desired level of difficulty.", text: "Does the benchmark give information from which an evaluator can judge whether its difficulty suits their purpose?", guidance: { met: "Results are reported by item difficulty tier or per item, or scores for at least three models of clearly different capability are reported, so headroom or saturation can be read off.", evidence: [paper, docs, website] } }
      - { id: 1.2.3b, principle: "Validated baseline measures (e.g., human performance on the same task).", text: "Does the benchmark provide a baseline measure to compare model scores against?", guidance: { met: "At least one baseline score is reported (human performance, random chance, prior automation, or humans assisted by AI); for a human baseline the number and expertise of participants are stated.", evidence: [paper, docs] } }
      - { id: 1.2.4a, principle: "Diversity of test items in the evaluation.", text: "Does the benchmark describe how its items were sourced, and how much they vary?", guidance: { met: "The documentation states where items came from (authors, sources, generation or templating process) and reports any templating, near-duplicates or shared structure among items.", evidence: [paper, docs] } }
      - { id: 1.2.4b, principle: "Quantity of test items.", text: "Does the benchmark state how many test items it has?", guidance: { met: "The item count is stated for the full test set and for each subset that results are reported on.", evidence: [paper, docs, dataset] } }
      - { id: 1.2.4c, principle: "Contamination risk can be reduced by efforts to keep benchmark data hidden during training or by using benchmark data generated after the system was created.", text: "Does the benchmark take a documented step to reduce training-data contamination?", guidance: { met: "At least one of: a held-out or private test split, items created after a stated date, a contamination analysis, or answers withheld from the public release.", evidence: [paper, docs, dataset] } }
      - { id: 1.2.4d, principle: "[Emerging Practice] Some benchmarks include canary strings (unique sequences intentionally inserted into benchmark data) to check for blatant instances of training on the test set.", text: "Does the benchmark data carry a canary string?", guidance: { met: "A canary string is present in the released data files or documentation, with a statement that it is a canary.", evidence: [dataset, repo, docs] } }
      - { id: 1.2.5a, principle: "Ease of use. Operational considerations include the amount of human labor required for setup and running, the computational cost to run the benchmark, and the benchmark's compatibility with a wide-range of AI systems (e.g., agent architectures).", text: "Does the benchmark state what it takes to run: setup effort, compute or token cost, and which kinds of system it supports?", guidance: { met: "The documentation states the resources needed for a full run (time, compute, tokens or money, or hardware) and the model or agent interfaces it supports.", evidence: [paper, docs, repo] } }
  - id: implement
    name: "Stage 2: Implementing and running evaluations"
    description: The benchmark-side of Practices 2.1 to 2.4 - what it specifies, ships and records so an evaluator can run it reproducibly.
    items:
      - { id: 2.1.1a, principle: "Comparability. If the evaluation objective is to compare models or systems, the evaluation protocol should be designed such that evaluation results can be meaningfully compared.", text: "Does the benchmark define a reference protocol and say which settings may vary without breaking comparability?", guidance: { met: "A standard protocol (prompts, settings, scoring) is designated as the one to use for comparison, and the documentation says which settings an evaluator may change and which they may not.", evidence: [paper, docs, repo] } }
      - { id: 2.1.1b, principle: "[Emerging Practice] One useful practice is to conduct optimization against a set of \"development set\" of benchmark items distinct from the \"test-set\" benchmark items being evaluated.", text: "Does the benchmark provide a development split separate from the test items?", guidance: { met: "A labelled development, validation or training split exists that does not overlap the test items.", evidence: [dataset, docs] } }
      - { id: 2.1.2a, principle: "Inference settings are those that influence the process by which the model generates its outputs, e.g., temperature or reasoning effort.", text: "Does the benchmark specify the inference settings used for its reported results?", guidance: { met: "Sampling settings (temperature, top_p or similar) and reasoning effort or budget are stated for the reported results, or the documentation states that the benchmark leaves them to the evaluator.", evidence: [paper, docs, repo] } }
      - { id: 2.1.2b, principle: "When presenting a test item to a model, the evaluator defines the instructions given to the model that describe how the item should be completed.", text: "Does the benchmark ship the exact prompts or instruction templates used?", guidance: { met: "The prompt text or template given to the model for each item is in the repo, dataset or paper appendix, verbatim.", evidence: [repo, paper, dataset] } }
      - { id: 2.1.2c, principle: "Scaffolding settings are those that configure the agentic architecture and system-level wrappers around the model, e.g., tool availability.", text: "Does the benchmark specify which tools and agent scaffold are available to the model?", guidance: { met: "The tools provided (including whether internet access is allowed) and the scaffold or agent loop used are named, or the benchmark states there are none.", not_applicable: "Each item is answered in a single model response with no tools, code execution, environment or multi-step loop.", evidence: [paper, docs, repo] } }
      - { id: 2.1.2d, principle: "The execution environment is the environment in which an agent's tool calls have an effect.", text: "Does the benchmark specify or provide the execution environment its tasks run in?", guidance: { met: "The environment is provided (container image, VM image, or build recipe) or fully specified (OS, packages, pre-loaded files, network access).", not_applicable: "Items do not run in an execution environment.", evidence: [repo, docs] } }
      - { id: 2.1.2e, principle: "For agentic evaluations a stopping condition must be explicitly defined.", text: "Does the benchmark define a stopping condition or resource budget for agentic runs?", guidance: { met: "A step, token, cost or time limit is stated, or the benchmark states that runs are unbounded.", not_applicable: "Items are not agentic (no multi-step run that could continue indefinitely).", evidence: [paper, docs, repo] } }
      - { id: 2.1.2f, principle: "For many agentic benchmarks, the evaluator determines the number of submission attempts an agent is allowed for a test item, as well as the type of feedback given to the agent for incorrect submissions.", text: "Does the benchmark specify how many submission attempts are allowed and what feedback incorrect submissions receive?", guidance: { met: "Number of attempts and the feedback given after an incorrect attempt are both stated.", not_applicable: "Each item takes a single submission with no retry or feedback.", evidence: [paper, docs, repo] } }
      - { id: 2.1.2g, principle: "Number of trials per test item. Having models attempt each item multiple times increases evaluation cost but can reduce uncertainty of evaluation results.", text: "Does the benchmark specify the number of trials per item and how trials are aggregated?", guidance: { met: "The number of attempts per item (or a statement of exactly one) and the aggregation across them (single sample, pass@k, best- or majority-of-N) are stated.", evidence: [paper, docs, repo] } }
      - { id: 2.1.2h, principle: "LLM as a judge. Because the results of the evaluations are determined solely by the LLM-judge, the design and quality of the judge can have a significant impact on the meaning of evaluation results.", text: "Where an LLM judge scores responses, does the benchmark specify the judge model, prompt and rubric?", guidance: { met: "The judge model (name and version), the judge prompt and the rubric are provided or stated.", not_applicable: "No LLM judge is used to score or parse responses.", evidence: [paper, docs, repo] } }
      - { id: 2.1.2i, principle: "[Emerging Practice] Some practices that are helpful when designing an LLM-as-a-judge setup include ensuring sufficient quality and consistency of grading and interpretations of the rubric, which can include comparing with human grading, using multiple judges and computing interrater agreement.", text: "Where an LLM judge is used, does the benchmark report evidence that the judge's grading is of sufficient quality?", guidance: { met: "Agreement between the judge and human graders, or between multiple judges, is reported as a number.", not_applicable: "No LLM judge is used to score or parse responses.", evidence: [paper, docs] } }
      - { id: 2.1.2j, principle: "Sensitivity analyses, such as tool ablation experiments, may be valuable for gauging robustness of evaluation results or assessing the impact of evaluation protocol design on results.", text: "Does the benchmark report how its results change under variations of the protocol?", guidance: { met: "Results under at least one varied protocol setting (prompt wording, tool set, budget, sampling) are reported.", evidence: [paper, docs] } }
      - { id: 2.2.1, principle: "Running evaluations can often be made easier by using evaluation frameworks, which provide software libraries for querying models, agent scaffolding and tools, error handling, and logging evaluation results.", text: "Does the benchmark ship runnable evaluation code, or an implementation in a standard evaluation framework?", guidance: { met: "Public code runs the evaluation end to end (querying a model, scoring, logging results) with run instructions, or the benchmark is implemented in a named public evaluation framework.", evidence: [repo, docs] } }
      - { id: 2.2.2, principle: "Parsing answers. Many evaluations require converting a model's answer into a specific format that can be programmatically compared to the correct answer.", text: "Does the benchmark specify the required answer format and ship the logic that extracts answers from responses?", guidance: { met: "The required output format is stated to the model and the extraction or parsing code (or the rule for unparseable outputs) is provided.", not_applicable: "Scoring needs no answer extraction (for example, the environment state is checked directly).", evidence: [repo, docs] } }
      - { id: 2.2.3, principle: "[Emerging Practice] Benchmark versioning. It is helpful to tag different versions of the benchmark with version numbers, and to track the version number associated with evaluation results.", text: "Does the benchmark have identifiable versions with a record of changes?", guidance: { met: "Releases carry version identifiers (tags, semantic versions, dataset revisions) and a changelog or release notes say what changed between them.", evidence: [repo, dataset, docs] } }
      - { id: 2.2.4, principle: "[Emerging Practice] Sandboxing. When agents are able to run arbitrary code, sandboxing them in containers or virtual machines reduces security risks and makes evaluations more portable.", text: "Where models can run code, does the benchmark run them in a sandbox?", guidance: { met: "The harness runs model-generated code or tool calls inside a container or virtual machine, and the sandbox definition is provided.", not_applicable: "Models cannot execute code or tool calls in this benchmark.", evidence: [repo, docs] } }
      - { id: 2.2.5, principle: "Modularity as a design principle. When writing evaluation code, it can be helpful to design the code to be compatible with many different types of models and agents.", text: "Can the benchmark's harness run models from different providers without code changes?", guidance: { met: "The harness takes the model as a configuration setting and supports more than one provider or an open interface (for example an OpenAI-compatible endpoint), as shown in the docs or code.", evidence: [repo, docs] } }
      - { id: 2.3.1, principle: "Saving full evaluation logs alongside summary statistics.", text: "Does the benchmark's harness save full per-item logs, not only summary scores?", guidance: { met: "Running the harness writes per-item records containing the model's response (or transcript) and its score.", evidence: [repo, docs] } }
      - { id: 2.3.2, principle: "Ensuring key information like the exact model/system version is present in evaluation logs. [Emerging Practice] Saving code or including commit hashes alongside evaluation logs.", text: "Does the harness record the model identifier and benchmark version in its logs?", guidance: { met: "The output logs include the model identifier and the benchmark version or code commit.", evidence: [repo, docs] } }
      - { id: 2.4.1.3, principle: "Test item solvability. It is important to validate the solvability of test items in evaluations that involve evaluated systems interacting with complex virtual environments.", text: "Does the benchmark document that its items were checked to be solvable and correctly keyed?", guidance: { met: "A validation step is described (reference solutions executed, expert answer checking, or a review pass) together with its outcome, such as items fixed or removed.", evidence: [paper, docs, repo] } }
      - { id: 2.4.1.4, principle: "Refusals. If refusal behavior during evaluation may differ from refusal behavior under realistic usage, evaluators should check for the presence of refusals or other safeguards interventions in evaluation transcripts.", text: "Does the benchmark say how refusals are scored, or report them separately?", guidance: { met: "The scoring treats refusals explicitly (counted as failures, excluded, or reported as a separate category) and the documentation says which.", not_applicable: "Items contain no content likely to trigger model safeguards (not safety-, security-, bio- or harm-related).", evidence: [paper, docs, repo] } }
      - { id: 2.4.1.5, principle: "[Emerging Practice] Evaluation cheating occurs when a model has an opportunity to solve a test item in an unintended way that undermines its measurement validity.", text: "Does the benchmark document steps against solution contamination and grader gaming?", guidance: { met: "The documentation states the internet-access policy and describes at least one check or design choice against cheating (no solution artefacts in the environment, hardened grader, transcript audit), or lists known cheating routes.", not_applicable: "Items are answered in a single response with no tools, code execution or environment, so no solution path exists beyond answering.", evidence: [paper, docs, repo] } }
      - { id: 2.4.2C, principle: "Task review. It can be helpful to manually review task instructions and ask: \"If a human was given the same instructions, would they be confused?\" It can be beneficial to include multiple individuals in this review process.", text: "Does the benchmark document a review of its task instructions for clarity?", guidance: { met: "The documentation states that task instructions were reviewed for ambiguity by more than one person, or that human testers attempted the tasks.", evidence: [paper, docs] } }
      - { id: 2.4.2D, principle: "Comparison to existing evidence. Compare results to existing evidence such as other results on the same or closely related benchmarks.", text: "Does the benchmark publish reference results that an evaluator can use to check their own setup?", guidance: { met: "Scores for at least one model are published with the exact model version and the protocol used, so an evaluator can run the same model and compare.", evidence: [paper, docs, website, repo] } }
      - { id: 2.4.2E, principle: "[Emerging Practice] Item pattern analysis. If an intended interpretation depends on assumed similarities or other relationships between benchmark items, consider analyzing whether the empirical results reflect this expected structure.", text: "Does the benchmark report results by subset, format or construct?", guidance: { met: "Scores are reported separately for each subset, item format or sub-construct the benchmark claims to combine.", not_applicable: "The benchmark has one item format and one subject area and claims a single construct.", evidence: [paper, docs] } }
  - id: report
    name: "Stage 3: Analyzing and reporting results"
    description: The benchmark-side of Practices 3.1 to 3.3 - what it defines and publishes so evaluators can analyse, share and qualify results.
    items:
      - { id: 3.1.2, principle: "Appropriate aggregate statistics are selected. This includes any aggregation functions applied at a test item level (e.g., across trials, such as pass@k) as well as across items (e.g., mean of item scores).", text: "Does the benchmark define its headline metric and how item scores are aggregated?", guidance: { met: "The headline metric and the aggregation across trials and across items are defined precisely; where the benchmark combines several constructs, sub-scores are also reported.", evidence: [paper, docs, repo] } }
      - { id: 3.1.3, principle: "Whenever possible, statistics are reported with estimated uncertainties for associated sources of variation.", text: "Does the benchmark report uncertainty on its own results and name the method?", guidance: { met: "Reported scores carry standard errors or confidence intervals, and the method and the source of variation covered (sampling, item selection, or both) are named.", evidence: [paper, docs, website] } }
      - { id: 3.2.1, principle: "Using an interoperable format or schema to share these details may improve clarity and ease of replication.", text: "Does the benchmark give evaluators a structured way to record the protocol and results they must report?", guidance: { met: "A config file, schema or report template captures the protocol settings and results, or the documentation lists the details a report of results should contain.", evidence: [repo, docs] } }
      - { id: 3.2.2, principle: "Consider reporting both aggregate statistics and item-level results. Item-level results can be particularly useful for enabling comparison of results obtained by different evaluators.", text: "Does the benchmark publish item-level results for its reference runs?", guidance: { met: "Per-item scores for at least one reference run are published in a downloadable file.", evidence: [dataset, repo, website] } }
      - { id: 3.2.3, principle: "[Emerging Practice] Report costs alongside performance.", text: "Does the benchmark report the cost of its reference runs next to their scores?", guidance: { met: "Tokens, money or time per run are reported for the reference results.", evidence: [paper, docs, website] } }
      - { id: 3.2.4, principle: "[Emerging Practice] Consider releasing transcripts. Publishing full or representative transcripts can make it easier for other parties to interpret and reproduce the results of evaluations.", text: "Does the benchmark publish transcripts from its reference runs?", guidance: { met: "Full transcripts, or a stated representative sample, of at least one reference run are downloadable.", evidence: [dataset, repo, website] } }
      - { id: 3.3.2, principle: "Report assumptions or evidence for the relationship between performance on the evaluated benchmark and the intended measurement construct.", text: "Does the benchmark give assumptions or evidence linking its scores to the construct it names?", guidance: { met: "The documentation presents a validity argument (why items resemble the target tasks) or empirical evidence (expert review, correlation with other measures) rather than asserting the link.", evidence: [paper, docs] } }
      - { id: 3.3.2a, principle: "If the benchmark is intended to be representative of real-world tasks, report the degree to which evaluation conditions resemble deployment conditions.", text: "Where the benchmark claims real-world representativeness, does it state how its conditions differ from deployment?", guidance: { met: "At least one respect in which the benchmark's conditions (tools, data, time pressure, task framing) differ from real deployment is stated.", not_applicable: "The benchmark does not claim to represent real-world tasks.", evidence: [paper, docs] } }
      - { id: 3.3.3, principle: "When comparing model behavior to baselines, provide context about baseline measure conditions (e.g., characteristics of baseline subjects, available tools, incentives, etc.).", text: "Where the benchmark reports a baseline, does it describe the conditions under which it was measured?", guidance: { met: "The baseline description states who or what was measured and under what conditions (tools, time, incentives) compared with the model runs.", not_applicable: "The benchmark reports no baseline.", evidence: [paper, docs] } }
      - { id: 3.3.4, principle: "Use caution when making claims that generalize evaluation results beyond the scope of the intended measurements. Consider adding relevant caveats or disclaimers when there is a significant risk that the audience may misinterpret or over-generalize evaluation results.", text: "Does the benchmark state what its scores should not be taken to show?", guidance: { met: "The documentation names at least one conclusion the scores do not support (for example, a high score does not show safety or real-world competence).", evidence: [paper, docs, website] } }
      - { id: 3.3.5, principle: "Clearly state other assumptions and limitations of the evaluation, such as sensitivity of results to measurement conditions and statistical assumptions.", text: "Does the benchmark document its limitations and known issues?", guidance: { met: "A limitations section, known-issues list or errata states at least one limitation of the benchmark, such as sensitivity to prompt format, label noise or statistical assumptions.", evidence: [paper, docs, repo] } }
