  estimate_basis: >-
    The page defines no item count; one item is one simulated year-long run (the leaderboard averages several runs).
    Calls are the midpoint of the stated 3,000-6,000 messages per run, each counted as a model call. Tokens: the
    system prompt caps context at about 69,000 and trims to about 61% when full, so mean input is about 55,000, plus
    about 18,000 output (the stated 60-100 million output tokens per run divided by 4,500 calls). These stated figures
    do not fit together well, so treat the estimate as rough. The score is the final bank balance. No download is
    described.
