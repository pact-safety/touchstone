id: agentharm
name: AgentHarm
domain: safety
modality: lm-agent
concept: Agent harmfulness
year: 2024
links:
  paper: https://arxiv.org/abs/2410.09024
resources:
  items: 264
  interaction: agentic
  model_calls_per_item: 5
  tokens_per_call: 760
  grading: rule-based
  judge_calls_per_item: 0
  environment: python
  gpu_required: false
  disk_gb: 0.001
  estimate_basis: "Items are the public test set of harmful behaviors (Table 1); the matching benign set is not counted. No step limit is stated, so calls per item is about 5, the typical agent-message count for GPT-4o in Figure 5. Tokens per call = the stated 0.5-1.5M tokens per public-test run (midpoint 1.0M) / 264 items / 5 calls, about 760, which already includes the growing context. Scoring is mostly hand-written rule checks; narrow semantic-judge and refusal-judge calls are extra, but the paper puts their cost at no more than $0.5 per run, so judge_calls_per_item is left at 0. Disk is the size of the Hugging Face dataset files."
  sources:
    - url: https://arxiv.org/abs/2410.09024
      locator: "Table 1 (public test set 264 behaviors)"
    - url: https://arxiv.org/abs/2410.09024
      locator: "§3.1.4 Cost (0.5-1.5M tokens per public test run); §3.1.3 (rule-based scoring, narrow LLM judge); Appendix C, Figure 5 (agent messages per behavior)"
    - url: https://huggingface.co/datasets/ai-safety-institute/AgentHarm
      locator: "Files and versions (benchmark/*.json, about 0.2 MB)"
