id: ailuminate
name: AILuminate v1.0
domain: safety
modality: language-model
concept: Hazard and reliability grading
year: 2025
links:
  paper: https://arxiv.org/abs/2503.05731
  repo: https://github.com/mlcommons/ailuminate
resources:
  items: 12000
  interaction: single-turn
  model_calls_per_item: 1
  tokens_per_call: 400
  grading: llm-judge
  judge_calls_per_item: 3
  environment: python
  gpu_required: false
  disk_gb: 0.001
  estimate_basis: "Items are the 12,000 official English prompts (1,000 per hazard, §4.1); the official set is confidential, and only the 1,200-prompt demo is public (about 0.3 MB CSV). Tokens per call are an estimate: a prompt of about 40 tokens plus a response of about 360 tokens. The evaluator is an ensemble of fine-tuned safety models whose size and identity are not published (§5.2), so judge_calls_per_item = 3 is an assumption, not a stated figure. Scoring runs through MLCommons ModelBench; gpu_required assumes the hosted evaluator."
  sources:
    - url: https://arxiv.org/abs/2503.05731
      locator: "§4.1 Structure and Composition (12,000 practice and 12,000 official prompts, 1,000 per hazard)"
    - url: https://arxiv.org/abs/2503.05731
      locator: "§5.2 Evaluator Architecture (ensemble of models, details confidential)"
    - url: https://github.com/mlcommons/ailuminate#readme
      locator: "README, Background and Access to full prompt set (24,000 prompts; 1,200 demo; ModelBench)"
