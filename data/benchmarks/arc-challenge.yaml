  estimate_basis: "Items are the Challenge test partition (1,172 of 2,590 Challenge questions). Tokens per call are an estimate for zero-shot multiple choice: a grade-school question stem plus four options of about 90 tokens, and a one-letter answer; few-shot setups cost more. Scoring is multiple-choice accuracy. Disk covers the question files only (Hugging Face parquet, about 1 MB); the optional 14M-sentence ARC Corpus (1.4 GB) is not needed to test a language model."
