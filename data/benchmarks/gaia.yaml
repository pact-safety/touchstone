  estimate_basis: "The paper states no step limit, so calls per item is the human step counts it defines (Level 1 at most 5, Level 2 about 5 to 10, Level 3 more), taken as 3, 7.5 and 12 and weighted by the 146/245/75 question split, giving about 7. Tokens use (system prompt 600 + tool observation 1,000) x 7 steps / 2 for the growing context, plus about 200 output, giving about 5,800. The 300 test answers are withheld, so scoring them needs the leaderboard. Disk is the Hugging Face dataset size (about 102 MB, attachments included)."
