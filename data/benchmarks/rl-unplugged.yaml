    Items are the tasks in the paper's four domains: 9 DM Control, 7 DM Locomotion, 46 Atari games and 4 RWRL tasks. Disk is the summed object sizes of the atari, dm_control_suite, dm_locomotion and rwrl prefixes in the public rl_unplugged GCS bucket that the README links (about 56.5 TB, nearly all Atari); the paper does not state a size. GPU is true because the paper's baselines train on a Tesla V100.
  sources:
