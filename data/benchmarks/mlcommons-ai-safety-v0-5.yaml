id: mlcommons-ai-safety-v0-5
name: MLCommons AI Safety v0.5
domain: safety
modality: language-model
concept: Hazardous responses
year: 2024
links:
  paper: https://arxiv.org/abs/2404.12241
  repo: https://github.com/mlcommons/modelbench
resources:
  items: 43090
  interaction: single-turn
  model_calls_per_item: 1
  tokens_per_call: 280
  grading: llm-judge
  judge_calls_per_item: 1
  environment: python
  gpu_required: false
  disk_gb: 0.01
  estimate_basis: >-
    Tokens are an estimate: prompts are a single sentence or statement plus question (about 30 tokens) and the paper caps generation at 500 tokens, so a mean answer of about 250 tokens is assumed. LlamaGuard scores each response once; the README has it run through a Together AI account, so no local GPU is counted. Disk is an estimate for 43,090 short text prompts (the paper does not state a size).
  sources:
    - url: https://arxiv.org/abs/2404.12241
      locator: "§4.3 Dataset overview and Table 4 (43,090 test items)"
    - url: https://arxiv.org/abs/2404.12241
      locator: "§5 Grading SUTs (LlamaGuard automated evaluator) and the response-collection settings (max 500 tokens)"
    - url: https://github.com/mlcommons/modelbench
      locator: "README, Requirements (LlamaGuard via a Together AI account; a full run takes several days)"
