  estimate_basis: The paper gives no total item count ("hundreds of market environments"), so items is the 30 Dow Jones constituent stocks of its stock-trading benchmark, the one fully specified task. It evaluates trained deep-RL trading agents in gym-style market environments, so there are no model calls or tokens. Disk is an estimate (daily OHLCV for 30 stocks over 2009 to 2022 is a few MB); the sources do not state a size. GPUs are used to speed up multi-process training (§4.2) but the paper does not require them.
  sources:
    - url: https://arxiv.org/abs/2211.03107
      locator: "§5.3 and Appendix C.2 (30 DJIA constituent stocks, train 2009-2020, test 2020-2022); §4.2 (hundreds of environments; GPU multiprocessing); §5.1 (Sharpe ratio and return metrics)"
    - url: https://github.com/AI4Finance-Foundation/FinRL-Meta
      locator: README, Overview and Plug-and-Play sections (gym-style environments; ElegantRL, Stable-Baselines3, RLlib agents)
