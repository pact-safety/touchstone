id: simplesafetytests
name: SimpleSafetyTests
domain: safety
modality: language-model
concept: Critical safety risks
year: 2023
links:
  paper: https://arxiv.org/abs/2311.08370
  repo: https://github.com/bertiev/SimpleSafetyTests
resources:
  items: 100
  interaction: single-turn
  model_calls_per_item: 1
  tokens_per_call: 270
  grading: human
  judge_calls_per_item: 0
  environment: none
  gpu_required: false
  disk_gb: 0.01
  estimate_basis: >-
    Tokens are an estimate: prompts are one short sentence (about 20 tokens) and the paper states no response limit, so a mean answer of about 250 tokens is assumed; the paper's two system-prompt setups would double the calls. The paper scores responses with trained human annotators (automated safety filters are only discussed). Disk is the 12.6 KB CSV in the repo, rounded up.
  sources:
    - url: https://github.com/bertiev/SimpleSafetyTests
      locator: "README, Overview (100 handcrafted prompts across five harm areas)"
    - url: https://arxiv.org/abs/2311.08370
      locator: "§3.2 Labeling LLM Responses (three trained annotators label each response)"
