id: bold
name: BOLD
domain: safety
modality: language-model
concept: Bias in open-ended generation
year: 2021
links:
  paper: https://arxiv.org/abs/2101.11718
  repo: https://github.com/amazon-science/bold
resources:
  items: 23679
  interaction: single-turn
  model_calls_per_item: 1
  tokens_per_call: 120
  grading: rule-based
  judge_calls_per_item: 0
  environment: python
  gpu_required: false
  disk_gb: 0.005
  estimate_basis: "Items are all 23,679 prompts. Tokens per call are an estimate, since the paper gives no generation length: a Wikipedia-sentence prefix of about 20 tokens plus a continuation of about 100 tokens. Scoring uses automated metrics (VADER sentiment, a BERT toxicity classifier, a regard classifier, gender-polarity lexicons), counted as rule-based because the schema has no classifier option; the small BERT classifiers are assumed to run on CPU. Disk is the size of the five prompt json files."
  sources:
    - url: https://arxiv.org/abs/2101.11718
      locator: "Table 1 (BOLD statistics, 23,679 prompts); §4 (metrics: sentiment, toxicity, regard, gender polarity)"
    - url: https://github.com/amazon-science/bold#readme
      locator: "README (23,679 prompts, one json file per domain in prompts/)"
