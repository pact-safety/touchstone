id: ale
name: Arcade Learning Environment
domain: capability
modality: rl-agent
concept: General game-playing agents
year: 2012
links:
  paper: https://arxiv.org/abs/1207.4708
  repo: https://github.com/Farama-Foundation/Arcade-Learning-Environment
resources:
  items: 55
  interaction: non-llm
  model_calls_per_item: 0
  tokens_per_call: 0
  grading: rule-based
  judge_calls_per_item: 0
  environment: simulator
  gpu_required: false
  disk_gb: 0.003
  estimate_basis: "Items are the 55 games of the paper's evaluation (5 training plus 50 test games). It evaluates RL agents in the Atari emulator, so there are no language-model calls or tokens; cost is emulator and agent compute. Scoring is the game score. Disk is the ale-py wheel size on PyPI (about 3 MB), which bundles the ROMs per the README."
  sources:
    - url: https://arxiv.org/abs/1207.4708
      locator: "Abstract (over 55 games); §3.1 Reinforcement Learning (5 training and 50 test games, 500 evaluation episodes per trial)"
    - url: https://github.com/Farama-Foundation/Arcade-Learning-Environment#readme
      locator: "README, Features (ROMs packaged within the pip package) and Quick Start (pip install ale-py)"
