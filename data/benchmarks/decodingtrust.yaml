  estimate_basis: "Items = the sum of the 'Prompts' column of Table 48 across the eight perspectives (GPT-3.5 row): 536,009. Tokens per call = (212.0M prompt + 33.2M completion tokens) / 536,009 prompts, about 460. Table 48 counts one run; some scenarios are repeated (up to 25 times, Tables 49-50), so real cost can be higher. Scoring is keyword and accuracy checks plus the Perspective API for toxicity, counted as rule-based. Disk is the Hugging Face dataset repo size; GPU is only needed if the model under test is hosted locally."
  sources:
