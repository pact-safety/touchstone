    - url: https://arxiv.org/abs/2306.11698
      locator: "Appendix H, Tables 49-50 (scenario repetitions)"
    - url: https://huggingface.co/datasets/AI-Secure/DecodingTrust
      locator: "Files and versions (repository size about 5.5 GB)"
