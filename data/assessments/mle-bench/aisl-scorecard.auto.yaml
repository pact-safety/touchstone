verdicts:
  cv.01:
    value: met
    rationale: The benchmark defines the target phenomenon as ML engineering and specifies that evidence is the ability to produce a submission file by training a model and running it on a test set.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 17, chunk 0
        quote: You must solve the task by training a model and running the model on the test set to produce a submission file.
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The documentation defines the scope as Kaggle competitions that provide clear problem statements and clean datasets, while explicitly excluding real-world AI R&D where problem statements and metrics are not clear.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 10, chunk 1
        quote: MLE-bench selects for Kaggle competitions that provide clear problem statements, datasets that are clean and well-documented, and have clear metrics for optimization. On the other hand, real-world AI R&D often may not even have a clear problem statement
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    rationale: The paper identifies facets such as complexity levels and task categories, but it does not report a separate score for every single sub-component/category in a table; it reports aggregate percentages.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: met
    rationale: The task space is defined by categories and complexity levels, and item counts are reported for the complexity dimension (29% low, 51% medium, 20% high).
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 14, chunk 0
        quote: There are 29% low, 51% medium and 20% high-complexity competitions.
    by: model
    quotes_verified: true
  cv.05:
    value: unmet
    rationale: While the total distribution of complexity is given, the docs do not report per-category item counts or a stratified sampling plan over the 15 categories.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.06:
    value: met
    rationale: Every competition was screened by at least two ML engineers to ensure it meets the benchmark's requirements.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 13, chunk 3
        quote: Each competition in our final set was screened by at least two ML engineers working at leading AI companies.
    by: model
    quotes_verified: true
  cv.07:
    value: unmet
    rationale: There is no mention of a specific named subset of boundary, perturbed, or adversarial items with a stated size and criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: unmet
    by: model
    rationale: The excerpts do not contain a table or figure comparing the same model on the original Kaggle dataset and on the adapted MLE-bench benchmark; they only compare different scaffolds or models on MLE-bench.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.09:
    value: unmet
    by: model
    rationale: The benchmark reuses Kaggle competitions, but the excerpts do not list each modification made to the reused data with its specific reason; they only generally mention re-implementation of grading and splits.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.10:
    value: unmet
    rationale: While the item count (75) is stated, there is no power calculation or confidence-interval half-width reported to justify statistical power.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 1, chunk 2
        quote: The resulting benchmark consists of 75 diverse Kaggle competitions
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.11:
    value: met
    rationale: The main results tables (Table 9 and 10) report scores as mean ± standard error, and the number of seeds/runs is stated in the text and table captions.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 6, chunk 0
        quote: Scores represent the mean ± one standard error of the mean.
    by: model
    quotes_verified: true
  cv.12:
    value: n/a
    rationale: The benchmark uses deterministic grading based on competition metrics and automated plagiarism/log tools; no human raters label the outputs.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 4, chunk 0
        quote: we implement the grading logic for each competition based on the described evaluation metric in the competition’s description, so that submissions can be graded locally.
    by: model
    quotes_verified: true
  cv.13:
    value: n/a
    rationale: No human raters are used to judge outputs.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 4, chunk 0
        quote: we implement the grading logic for each competition based on the described evaluation metric in the competition’s description
    by: model
    quotes_verified: true
  cv.14:
    value: n/a
    rationale: Every label comes from a deterministic key (the competition's evaluation metric/leaderboard logic).
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 4, chunk 0
        quote: we implement the grading logic for each competition based on the described evaluation metric in the competition’s description
    by: model
    quotes_verified: true
  cv.15:
    value: n/a
    rationale: Every label comes from a deterministic key (the competition's evaluation metric/leaderboard logic).
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 4, chunk 0
        quote: we implement the grading logic for each competition based on the described evaluation metric in the competition’s description
    by: model
    quotes_verified: true
  cv.16:
    value: unmet
    rationale: The docs do not provide a table or figure breaking down failures by a named confound like format or length.
    evidence: []
    by: model
    quotes_verified: true
  cv.17:
    value: unmet
    rationale: The docs describe failure modes in text (e.g., overloading RAM), but they do not report named failure categories with associated counts or shares.
    evidence: []
    by: model
    quotes_verified: true
  cv.18:
    value: unmet
    rationale: The docs do not contain a single statement that names the tasks, each metric, and the construct from cv.01 they measure with a stated reason.
    evidence: []
    by: model
    quotes_verified: true
  cv.19:
    value: met
    rationale: The benchmark is compared to MLAgentBench and ML-Bench, noting that MLE-bench provides more tasks with more complexity and requires starting from scratch.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 9, chunk 2
        quote: In contrast, MLE-bench provides significantly more tasks with more complexity, and requires agents to attempt the task from scratch.
    by: model
    quotes_verified: true
  cv.20:
    value: met
    rationale: The docs provide a limitations statement regarding the scope of AI R&D and link the benchmark to the real-world capability of accelerating scientific progress.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 10, chunk 1
        quote: the tasks included in MLE-bench don’t cover the full spectrum of capabilities required for AI R&D.
    by: model
    quotes_verified: true
  iv.01:
    value: unmet
    rationale: The documentation does not identify secondary capabilities nor provide control conditions or ablation results for them.
    evidence: []
    by: model
    quotes_verified: true
  iv.02:
    value: met
    rationale: The documentation names related phenomena/benchmarks that measure similar capabilities, such as software engineering and data science tasks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 9, chunk 3
        quote: DSBench (Jing et al., 2024) also introduces a benchmark of Kaggle competitions, but much like Weco AI’s dataset, DSBench focuses on data science tasks.
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.03:
    value: unmet
    rationale: While overlap with DSBench is mentioned, it is not quantified (e.g., via correlation) and no mitigation steps are described.
    evidence: []
    by: model
    quotes_verified: true
  iv.04:
    value: unmet
    by: model
    rationale: The excerpts do not report results under at least two output-format conditions, nor do they report format-failure rates separately from task failures.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.05:
    value: unmet
    rationale: No prompt-perturbation experiment with a variance or spread measure is reported.
    evidence: []
    by: model
    quotes_verified: true
  iv.06:
    value: unmet
    by: model
    rationale: The excerpts do not compare parser output with reference labels on at least two response formats, nor report agreement/accuracy per format.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.07:
    value: unmet
    rationale: The paper does not report a contamination check result or training cutoff for every evaluated model; it only mentions a general investigation for GPT-4o.
    evidence: []
    by: model
    quotes_verified: true
  iv.08:
    value: met
    rationale: The benchmark is described as an offline environment, implying a static snapshot of the competitions.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 1, chunk 1
        quote: We introduce MLE-bench, an offline Kaggle competition environment
    by: model
    quotes_verified: true
  iv.09:
    value: unmet
    by: model
    rationale: The excerpts do not explicitly state that the harness resets state per task (e.g., fresh container) in the code or docs provided.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.10:
    value: unmet
    by: model
    rationale: "The benchmark uses Kaggle competitions which require producing submission files, not multiple-choice questions, but the rule requires verifying the format is not MCQ or has mitigations. Since it is not MCQ, this condition is technically met by the format, but the rule asks to 'Avoid MCQs, unless mitigations...'. The format is not MCQ. However, looking at the decision rule: 'The format is not multiple choice...'. The benchmark is not MCQ. Wait, the decision rule is 'met when: The format is not multiple choice...'. The benchmark is not MCQ. So it should be met? Let's re-read carefully. 'Avoid MCQs... met when: The format is not multiple choice...'. MLE-bench is not MCQ. So it is met. But wait, is there any MCQ? No. So it is met. Let me check if I missed any MCQ mention. No. So iv.10 is met."
    evidence:
      - source: paper
        quote: We introduce MLE-bench, an offline Kaggle competition environment for assessing how well AI agents can perform difficult machine learning engineering (MLE) tasks.
        locator: 2410.07095v6 page 1, chunk 1
        url: https://arxiv.org/abs/2410.07095v6
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  ev.01:
    value: unmet
    rationale: The documentation mentions manual screening and annotation by 'our team', but does not name specific domain experts or user groups consulted to define scenarios and criteria.
    evidence: []
