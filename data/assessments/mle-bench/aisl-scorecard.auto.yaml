    quotes_verified: true
  ev.02:
    value: unmet
    rationale: While the team manually screened competitions, the docs do not specify the reviewers' credentials or state that a specific sample size of items was reviewed for accuracy and relevance.
    evidence: []
    by: model
    quotes_verified: true
  ev.03:
    value: unmet
    rationale: The excerpts describe different agent scaffolds (AIDE, OpenHands, MLAB), but they do not report results under more than one prompting or elicitation setting (e.g., zero- vs few-shot).
    evidence: []
