verdicts:
  cv.01:
    value: met
    rationale: The benchmark defines the target phenomenon as ML engineering and specifies that evidence is the ability to produce a submission file by training a model and running it on a test set.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 17, chunk 0
        quote: You must solve the task by training a model and running the model on the test set to produce a submission file.
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The documentation defines the scope as Kaggle competitions that provide clear problem statements and clean datasets, while explicitly excluding real-world AI R&D where problem statements and metrics are not clear.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.07095v6
        locator: 2410.07095v6 page 10, chunk 1
        quote: MLE-bench selects for Kaggle competitions that provide clear problem statements, datasets that are clean and well-documented, and have clear metrics for optimization. On the other hand, real-world AI R&D often may not even have a clear problem statement
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    rationale: The paper identifies facets such as complexity levels and task categories, but it does not report a separate score for every single sub-component/category in a table; it reports aggregate percentages.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
