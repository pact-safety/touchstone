    adjudicated_by: adjudicator-v4
  cor.02:
    value: unmet
    by: model
    rationale: The excerpts do not report an adversarial or reward-hacking test of the model rater, nor do they describe a named defense against such attacks. They mention a plagiarism detector and log analysis tool, but these are for contamination/rule-breaking checks, not rater robustness.
