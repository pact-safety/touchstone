        url: https://arxiv.org/abs/2308.01263v3
        locator: 2308.01263v3 page 13, chunk 1
        quote: set the temperature to zero to make responses deterministic. We also set the maximum response length to 256 tokens
    by: model
    quotes_verified: true
  iv.04:
    value: met
    rationale: The benchmark uses contrasting unsafe prompts to control for the confound of lexical overfitting/safety-related words.
    evidence:
