verdicts:
  cv.01:
    value: met
    rationale: The paper defines exaggerated safety as models refusing safe requests that superficially resemble unsafe ones.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2308.01263v3
        locator: 2308.01263v3 page 8, chunk 4
        quote: Exaggerated safety, whereby models falsely refuse even safe requests if they superficially resemble unsafe ones
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The docs state the benchmark covers short, simple, English-language questions in single-turn settings, and explicitly mentions it has 'limited coverage'.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2308.01263v3
        locator: 2308.01263v3 page 9, chunk 1
        quote: XST EST has limited coverage. Our test prompts are short, simple, English-language questions across a small set of prompt types
    by: model
    quotes_verified: true
  cv.03:
    value: met
    rationale: The phenomenon is broken down into ten prompt types, and Table 1 reports refusal rates for each type independently.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2308.01263v3
        locator: 2308.01263v3 page 4, chunk 1
        quote: "Table 1: XST EST covers ten prompt types with 25 safe test prompts each for a total of 250 safe test prompts."
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.04:
    value: met
    rationale: The task space is defined by ten prompt types, and the item count (25 per type) is reported.
    evidence:
