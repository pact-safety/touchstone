    rationale: The benchmark does not discuss or test distribution shift as a safety-critical issue.
    evidence: []
    by: model
    quotes_verified: true
  r3.b:
    value: unmet
    by: model
    rationale: The excerpts state that 'three authors of this paper' performed the annotation, but do not document annotator selection, disagreement patterns, or demographics.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  r3.c:
