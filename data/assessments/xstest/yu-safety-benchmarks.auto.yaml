  r8.a:
    value: unmet
    by: model
    rationale: While the paper mentions using an API for GPT-4 and setting temperature to zero, it does not record the access date for all models in a way that satisfies the rule for 'reported runs' comprehensively, nor does it explicitly list system prompts for all runs in the excerpts provided (only mentions 'standard system prompt' for GPT-4 and 'safety-emphasising system prompt' for others generally). Specifically, it lacks the specific access dates for Llama2 and Mistral inference runs in the text excerpts, only mentioning collection dates for responses which might be distinct from access dates, and omits specific inference parameters for non-zero-temperature runs if any existed (though it says zero). However, the biggest missing piece is the explicit recording of system prompts for all models in the excerpts (only GPT-4's is quoted).
