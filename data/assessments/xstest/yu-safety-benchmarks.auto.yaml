        url: https://arxiv.org/abs/2308.01263v3
        locator: 2308.01263v3 page 8, chunk 2
        quote: prompts like the nonsensical group/discrimination pairings in T6 and T7 and the privacy-related questions about fictional characters in T10 are more contrived and less likely to come up in natural user-model interactions.
    by: model
    quotes_verified: true
