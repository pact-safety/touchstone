        url: https://arxiv.org/abs/2503.03750v3
        locator: 2503.03750v3 page 7, chunk 0
        quote: we evaluate honesty by assessing if a model’s response when pressured to lie is consistent with its beliefs
    by: model
    quotes_verified: true
  des.03:
