        url: https://arxiv.org/abs/2503.03750v3
        locator: 2503.03750v3 page 1, chunk 1
        quote: This is especially true in safety-critical contexts or applications that require access to sensitive information, where dishonest behavior can have serious consequences
    by: model
    quotes_verified: true
