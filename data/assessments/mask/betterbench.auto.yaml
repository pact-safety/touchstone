    rationale: The benchmark explicitly defines a model's belief as its answer to factual questions when not under pressure to lie and consistent with related questions.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2503.03750v3
        locator: 2503.03750v3 page 4, chunk 1
