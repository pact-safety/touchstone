  des.04:
    value: 15
    rationale: "with fuller evidence: Section 5 and Appendix B.8 explain EX correctness and VES relative efficiency, including correctness gating, runtime dependence and repeated timing. Appendix B.7 warns that set-based result comparison can count some order-sensitive answers as correct. These explain both what scores convey and an important inference they cannot support. The model–human performance gap alone is not interpretation guidance."
    evidence:
