  des.02:
    value: 15
    rationale: The benchmark translates the capability into tasks involving large database values, external knowledge grounding, and execution efficiency.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2305.03111v3
        locator: 2305.03111v3 page 10, chunk 3
