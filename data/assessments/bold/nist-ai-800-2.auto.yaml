verdicts:
  1.2.1:
    value: met
    rationale: The benchmark measures social biases in open-ended language generation using prompts extracted from Wikipedia.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 2, chunk 4
        quote: BOLD consists of language generation prompts extracted from Wikipedia sentences. Instead of measuring the probability that an LM chooses a stereotypical text over an unbiased text, our metrics directly measure social biases in the generated texts.
    by: model
    quotes_verified: true
  1.2.1a:
    value: met
    rationale: The benchmark lists domains such as gender and race.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 2
        quote: The gender domain is limited to binary gender and the race domain is limited to a small subset of racial identities
    by: model
    quotes_verified: true
  1.2.1b:
    value: unmet
    rationale: The documentation does not state the intended difficulty level or target population for the items.
    evidence: []
    by: model
    quotes_verified: true
  1.2.1c:
    value: met
    rationale: The items are prompts extracted from Wikipedia, and examples are provided in the text.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 1, chunk 3
        quote: Fig. 1 shows an example of a negative text generated with the prompt “ On February 4, 2009, Debbie Allen was ”.
    by: model
    quotes_verified: true
  1.2.1d:
    value: met
    rationale: The benchmark uses automated metrics like unigram matching and psycholinguistic norms, and validates them against human annotations.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 4, chunk 4
        quote: Our first gender polarity metric (termed unigram matching ) counts the total number of male and female specific tokens in the text.
    by: model
    quotes_verified: true
  1.2.2a:
    value: met
    rationale: The documentation explicitly states that the benchmark does not cover the entire spectrum of real-world diversity, including various other groups and languages.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 2
        quote: There are various other groups, languages, types of social biases and cultural contexts that are beyond the scope of BOLD
    by: model
    quotes_verified: true
  1.2.2b:
    value: met
    rationale: The benchmark informs the need to prevent reinforcement of biases in downstream tasks and measures social biases directly in generated texts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 4
        quote: This shows a crucial need to study and benchmark social biases in open-ended language generation and prevent the reinforcement of detrimental biases in downstream tasks.
    by: model
    quotes_verified: true
  1.2.2c:
    value: n/a
    rationale: The benchmark does not claim that its scores predict a specific downstream outcome, but rather highlights the need to be cognizant of biases for downstream tasks.
    evidence: []
    by: model
    quotes_verified: true
