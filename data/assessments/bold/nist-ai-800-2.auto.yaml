        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 4
        quote: This shows a crucial need to study and benchmark social biases in open-ended language generation and prevent the reinforcement of detrimental biases in downstream tasks.
    by: model
    quotes_verified: true
