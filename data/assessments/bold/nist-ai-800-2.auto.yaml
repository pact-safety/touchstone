        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 4, chunk 4
        quote: Our first gender polarity metric (termed unigram matching ) counts the total number of male and female specific tokens in the text.
    by: model
    quotes_verified: true
  1.2.2a:
    value: met
    rationale: The documentation explicitly states that the benchmark does not cover the entire spectrum of real-world diversity, including various other groups and languages.
    evidence:
