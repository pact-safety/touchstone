verdicts:
  r1.a:
    value: met
    rationale: The benchmark identifies bias in five domains and lists specific metrics used to measure them, including sentiment, regard, psycholinguistic norms, toxicity, and gender polarity.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 2, chunk 1
        quote: "to measure biases from multiple angles we augment various existing bias metrics like sentiment and regard with novel bias metrics: psycholinguistic norms, toxicity, and gender polarity."
    by: model
    quotes_verified: true
  r1.b:
    value: met
    rationale: The benchmark specifies it evaluates English language generation and notes that its prompts may not reflect the full diversity of text beginnings models encounter.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 2, chunk 1
        quote: evaluating bias in open-ended English language generation
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 2, chunk 5
        quote: This may pose a challenge in collecting prompts that accurately reflect the diversity and structure of text beginnings that text generation models are subjected to.
    by: model
    quotes_verified: true
  r1.c:
    value: unmet
    rationale: The excerpts do not contain a statement that a good score does not guarantee safety against untested or emergent risks.
    evidence: []
    by: model
    quotes_verified: true
