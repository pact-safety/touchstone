verdicts:
  def.1:
    value: met
    rationale: The paper provides a definition of a biased language generation model based on the observable output of generating text perceived as negative, unfair, prejudiced, or stereotypical.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 1, chunk 3
        quote: a language generation model is biased if it disproportionately generates text that is often perceived as being negative, unfair, prejudiced, or stereotypical against an idea or a group of people with common attributes.
    by: model
    quotes_verified: true
  def.2:
    value: met
    rationale: The scope is defined by the demographic domains considered, and the text explicitly names other groups, languages, and social biases as being beyond that scope.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 2
        quote: There are various other groups, languages, types of social biases and cultural contexts that are beyond the scope of BOLD
    by: model
    quotes_verified: true
  def.3:
    value: met
    rationale: The phenomenon is broken down into demographic domains (sub-components) which are listed and measured separately.
    evidence:
