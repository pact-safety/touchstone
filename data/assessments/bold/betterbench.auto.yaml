verdicts:
  des.01:
    value: 15
    rationale: The benchmark defines a biased language generation model as one that disproportionately generates text perceived as negative, unfair, prejudiced, or stereotypical.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 1, chunk 3
        quote: Broadly, one can say a language generation model is biased if it disproportionately generates text that is often perceived as being negative, unfair, prejudiced, or stereotypical against an idea or a group of people with common attributes.
    by: model
    quotes_verified: true
  des.02:
    value: 15
    rationale: The paper describes how the concept of bias is measured by using prompts to trigger text generation and then applying metrics for sentiment, toxicity, and gender polarity.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 4
        quote: We presented a novel dataset BOLD and a set of metrics to evaluate fairness in open-ended language generation.
    by: model
    quotes_verified: true
  des.03:
    value: 15
    rationale: The paper explains that benchmarking social biases is necessary to prevent the reinforcement of detrimental biases in downstream tasks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 4
        quote: This shows a crucial need to study and benchmark social biases in open-ended language generation and prevent the reinforcement of detrimental biases in downstream tasks.
    by: model
    quotes_verified: true
  des.04:
    value: 10
    rationale: "The paper describes a limitation: BOLD provides an indication of bias in specific categories but is not an indication that a model is completely fair."
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 2
        quote: benchmarking on BOLD provides an indication of whether a model is biased in the categories considered in BOLD, however, it is not an indication that a model is completely fair.
    by: model
    quotes_verified: true
  des.05:
