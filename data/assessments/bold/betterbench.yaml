  des.01:
    value: 15
    rationale: 'The authors mention: "To systematically study and benchmark social biases in open-ended language generation".'
    evidence:
      - source: website
        url: https://betterbench.stanford.edu/database.html
        locator: BetterBench database entry "BOLD", Design criterion 1
    by: human
  des.02:
    value: 15
    rationale: 'The authors mention: "In this work we propose to examine bias in open-ended language generation by triggering or prompting language models (LMs) with seed words matching the distribution of human-written text. Our intuition is that while carefully handpicked LM triggers and choices of LM generations can show some interesting results, they could misrepresent the level of bias that an LM produces when presented with more natural prompts."'
    evidence:
      - source: website
        url: https://betterbench.stanford.edu/database.html
        locator: BetterBench database entry "BOLD", Design criterion 2
    by: human
  des.03:
    value: 15
    rationale: This is covered in the Introduction.
    evidence:
      - source: website
        url: https://betterbench.stanford.edu/database.html
        locator: BetterBench database entry "BOLD", Design criterion 3
    by: human
  des.04:
    value: 15
    rationale: 'Section 4 talks about how scores should be interpreted Section 7 talks about how they should not be interpreted: "Several works have shown that the distribution of demographics of Wikipedia authors is highly skewed resulting in various types of biases [...]. Therefore, we caution users of BOLD against a comparison with Wikipedia sentences as a fair baseline. Our experiments on comparing Wikipedia sentences with texts generated by LMs also show that the Wikipedia is not free from biases and the biases it exhibits resemble the biases exposed in the texts generated by LMs (see Section 6.2)."'
    evidence:
      - source: website
        url: https://betterbench.stanford.edu/database.html
        locator: BetterBench database entry "BOLD", Design criterion 4
    by: human
