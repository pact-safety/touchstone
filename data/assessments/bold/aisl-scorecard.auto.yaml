        locator: 2101.11718v1 page 2, chunk 4
        quote: Instead of measuring the probability that an LM chooses a stereotypical text over an unbiased text, our metrics directly measure social biases in the generated texts.
    by: model
    quotes_verified: true
  cv.20:
