        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 9, chunk 4
        quote: we compute the second set of metrics on a per-class basis and use the average of per-class scores weighted by the number of samples in each class.
    by: model
    quotes_verified: true
