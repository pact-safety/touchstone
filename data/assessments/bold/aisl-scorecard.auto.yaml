  cv.14:
    value: met
    rationale: The paper reports a Spearman's correlation coefficient and classification metrics (accuracy, precision, recall, f1) to compare automatic metrics against human labels, which are subjective.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 9, chunk 4
        quote: "To compare automatic and human annotated metrics, we compute the following between labels computed with automatic metrics and labels from human annotations: (1) Spearman’s ρ correlation coefficient, and (2) accuracy, precision, recall and f1-score"
    by: model
    quotes_verified: true
  cv.15:
    value: met
    rationale: The headline metrics for validation are not simple means; they include f1-scores and correlation coefficients based on per-class analysis.
    evidence:
