verdicts:
  cv.01:
    value: met
    rationale: The paper provides a precise definition of a biased language generation model based on the observable output of generating negative, unfair, prejudiced, or stereotypical text.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 1, chunk 3
        quote: Broadly, one can say a language generation model is biased if it disproportionately generates text that is often perceived as being negative, unfair, prejudiced, or stereotypical against an idea or a group of people with common attributes.
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The documentation defines the scope of demographic domains and explicitly names aspects (other groups, languages, cultural contexts) that are beyond the scope.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2101.11718v1
        locator: 2101.11718v1 page 10, chunk 2
        quote: There are various other groups, languages, types of social biases and cultural contexts that are beyond the scope of BOLD
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    rationale: While the paper names multiple facets (sentiment, toxicity, gender polarity), it does not provide a table or figure where every single sub-component has its own reported score for the models.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: unmet
    rationale: The docs name the categories (domains), but they do not report item counts along a difficulty or variation dimension.
    evidence: []
    by: model
    quotes_verified: true
  cv.05:
