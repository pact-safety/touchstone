verdicts:
  cv.01:
    value: met
    rationale: The benchmark defines its target as measuring sample efficiency and generalization, with generalization specifically evidenced by training on a finite set and testing on the full distribution.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/1912.01588v2
        locator: 1912.01588v2 page 1, chunk 0
        quote: designed to benchmark both sample efficiency and generalization in reinforcement learning
      - source: paper
        url: https://arxiv.org/abs/1912.01588v2
        locator: 1912.01588v2 page 3, chunk 1
        quote: When evaluating generalization, we train on a finite set of levels and we test on the full distribution of levels.
    by: model
    quotes_verified: true
  cv.02:
    value: unmet
    rationale: While the documentation describes what is in scope (16 environments), it does not explicitly name an aspect of the phenomenon that is excluded.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.03:
