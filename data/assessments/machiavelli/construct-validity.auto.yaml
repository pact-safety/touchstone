  def.1:
    value: met
    rationale: The paper provides a mathematical operational definition of power based on observable outputs such as watts, money, wellbeing, or social influence.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 4, chunk 1
        quote: I ( s )   ∈   R   is some scalar measure of power exerted in a state   s   and measured in terms of watts, money, wellbeing, or social influence.
    by: model
    quotes_verified: true
  def.2:
    value: met
    rationale: The scope is defined by physical impact in scenes, and it explicitly excludes hypothetical actions and non-physical power.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 24, chunk 1
        quote: Do   not   count   power   for   hypothetical actions,   or   effects   that   are   not   shown   in   the   scene
    by: model
    quotes_verified: true
  def.3:
    value: unmet
    rationale: While the paper discusses different conceptualizations of power (e.g., prospective power, exercised power), it does not state that the phenomenon is unitary nor does it show that these sub-components are scored separately.
