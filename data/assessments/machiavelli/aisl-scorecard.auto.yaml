verdicts:
  cv.01:
    value: met
    rationale: The benchmark defines power through observable outputs (exercised power) and inputs (resource power), specifying units like watts and money.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 13, chunk 2
        quote: We measure power in terms of watts, money, wellbeing, and social influence.
    by: model
    quotes_verified: true
  cv.02:
    value: unmet
    rationale: The documentation does not explicitly name an aspect of the phenomenon that is excluded from the scope.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.03:
    value: unmet
    by: model
    adjudicated_by: adjudicator-v4
    rationale: The decision rule requires every named sub-component to have its own reported score in a table or figure. While the paper defines multiple power types (watts, money, etc.), the results tables (e.g., Table 2) report aggregate metrics like 'Goals' and 'Norm.' rather than independent scores for each power facet.
    evidence: []
    quotes_verified: true
  cv.04:
    value: unmet
    rationale: While the task space is described as text-based adventure games, there is no report of item counts along a difficulty or variation dimension.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.05:
    value: unmet
    rationale: The documentation mentions sampling 2,000 scenes uniformly at random, but does not report per-category item counts over the task space.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 4, chunk 3
        quote: on a test set of 2,000 scenes sampled uniformly at random from all games.
    by: model
    quotes_verified: true
  cv.06:
    value: met
    rationale: The benchmark uses GPT-4 to label scenes, and the quality is verified by comparing model labels against an ensemble of expert authors.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 4, chunk 3
        quote: We define the gold labels on the test set to be the ensemble of labels from three experts (authors).
    by: model
    quotes_verified: true
  cv.07:
    value: unmet
    rationale: There is no mention of a named subset of boundary, perturbed, or adversarial items with a stated size and criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: unmet
    by: model
    adjudicated_by: adjudicator-v4
    rationale: The decision rule requires a table or figure comparing the same model on the original dataset and the adapted benchmark. The paper compares models on MACHIAVELLI but does not provide a direct comparison table against an 'original' prior benchmark dataset in the provided excerpts.
    evidence: []
    quotes_verified: true
  cv.09:
    value: unmet
    by: model
    adjudicated_by: adjudicator-v4
    rationale: The decision rule requires each modification to reused data to be listed with its reason. The excerpts do not describe modifications to a reused dataset, but rather the creation of a new benchmark from games.
    evidence: []
    quotes_verified: true
  cv.10:
    value: unmet
    rationale: The item count for the test set is stated, but no power calculation or confidence-interval half-width is reported.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 4, chunk 3
        quote: on a test set of 2,000 scenes sampled uniformly at random from all games.
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.11:
    value: unmet
    rationale: The results table (Table 2) provides mean scores but does not include confidence intervals or standard errors for each score.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 6, chunk 0
        quote: Table 2. Mean scores across the 30 test set games for several agents.
    by: model
    quotes_verified: true
  cv.12:
    value: unmet
    rationale: Humans supply validation labels (§2.4), so this is applicable. Appendix F reproduces GPT-4 prompts, but does not establish that human-rater instructions or training materials were published.
    evidence: []
    by: human
  cv.13:
    value: n/a
    rationale: The benchmark uses GPT-4 and a small number of expert authors for labeling, not a demographic group of human raters requiring bias mitigation.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2304.03279v4
        locator: 2304.03279v4 page 17, chunk 0
        quote: we use GPT-4 (OpenAI, 2023) to label all our scenes
    by: model
    quotes_verified: true
  cv.14:
    value: unmet
    rationale: The labels (morality, power) are subjective, but no per-item disagreement distribution or inter-annotator agreement statistic is reported beside the aggregate scores.
    evidence: []
    by: model
    quotes_verified: true
  cv.15:
    value: unmet
    by: model
    adjudicated_by: adjudicator-v4
    rationale: The labels are derived from deterministic keys (GPT-4 or ensemble majority), so the rule about not reducing subjective labels to single-point aggregates does not apply in the same way, but the verdict is unmet because the condition for subjective labels is not met (they are treated as objective ground truth proxies).
    evidence:
      - source: paper
        quote: Our final model+ labels surpass crowd ens labels in 16/18 label categories.
