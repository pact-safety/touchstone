verdicts:
  cv.01:
    value: met
    rationale: The documentation defines the target phenomenon as the safety capabilities of LLMs and specifies that evidence is based on whether models provide answers to prompts they are expected not to answer.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2308.13387v2
        locator: 2308.13387v2 page 1, chunk 2
        quote: consist only of prompts to which we expect responsible language models to not provide answers
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The documentation specifies the scope (English, single-turn, zero-shot) and explicitly excludes the sixth risk area from the taxonomy.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2308.13387v2
        locator: 2308.13387v2 page 3, chunk 3
        quote: we keep the first five risk areas while excluding the sixth risk area from our taxonomy
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    rationale: While the paper mentions a three-level taxonomy and risk areas, there is no evidence that every sub-component has its own reported score in a table or figure.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: met
    rationale: The task space is defined by a three-level risk taxonomy, and the paper reports the total item count (939 questions).
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2308.13387v2
        locator: 2308.13387v2 page 12, chunk 0
        quote: we assembled a dataset consisting of 939 questions
    by: model
    quotes_verified: true
  cv.05:
    value: unmet
    rationale: The documentation does not report per-category item counts or a stratified sampling plan; it only mentions generating 10-20 questions per harm type.
    evidence: []
    by: model
    quotes_verified: true
  cv.06:
    value: unmet
    rationale: While the dataset is 'curated and filtered', there is no description of a verification step's pass rate or specific criteria for each item.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.07:
    value: unmet
    rationale: The documentation mentions 'boundary-case questions' in the analysis, but does not define a named subset with a stated size and membership criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: unmet
    by: model
    rationale: The paper mentions prior work (Ganguli et al., Wei et al.) but does not provide a table or figure comparing the same models on the original dataset and the adapted benchmark. It compares models on its own dataset.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.09:
    value: unmet
    by: model
    rationale: The paper does not explicitly list modifications to a reused dataset with reasons. It generates new questions using GPT-4 based on a taxonomy.
    evidence:
      - source: paper
        quote: Based on the 61 specific risks or harms in Figure 2, we use GPT-4 to generate 10–20 questions or question templates for each harm type.
        locator: 2308.13387v2 page 5, chunk 2
        url: https://arxiv.org/abs/2308.13387v2
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.10:
    value: unmet
    rationale: The item count is stated, but there is no power calculation or confidence-interval half-width reported.
    evidence: []
    by: model
    quotes_verified: true
  cv.11:
    value: unmet
    rationale: The results mentioned (e.g., in Table 4 or 5) do not show confidence intervals or standard errors for every score.
    evidence: []
    by: model
    quotes_verified: true
  cv.12:
    value: met
    rationale: The paper states that GPT-4 uses the same guidelines as human annotation and refers to Table 3 for these guidelines.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2308.13387v2
        locator: 2308.13387v2 page 9, chunk 3
        quote: use the same guidelines as for human annotation (Table 3)
    by: model
    quotes_verified: true
  cv.13:
    value: unmet
    rationale: There is no report of rater demographics or mitigation of demographic skew.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.14:
    value: unmet
    rationale: The labels (harmful/harmless or action categories) are subjective, but no per-item disagreement distribution or inter-annotator agreement statistic is reported beside the aggregate score.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.15:
    value: unmet
    rationale: The headline metrics (precision, recall, F1) are based on aggregate labels, and there is no evidence that they avoid single-point aggregates for subjective labels.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.16:
    value: unmet
    rationale: The paper analyzes response length, but does not break down failures by a named confound in a table or figure showing counts or rates.
    evidence: []
    by: model
    quotes_verified: true
  cv.17:
    value: unmet
    rationale: The paper provides examples of mismatched cases and boundary cases, but does not report named failure categories with associated counts or shares.
    evidence: []
    by: model
    quotes_verified: true
  cv.18:
