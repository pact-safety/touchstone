        url: https://arxiv.org/abs/2308.13387v2
        locator: 2308.13387v2 page 2, chunk 1
        quote: Gehman et al. (2020) proposed the RealToxicityPrompts dataset to benchmark whether language models tend to generate toxic language
      - source: paper
        url: https://arxiv.org/abs/2308.13387v2
        locator: 2308.13387v2 page 3, chunk 2
        quote: In this work, we aim to build up a comprehensive risk taxonomy
    by: model
    quotes_verified: true
