verdicts:
  des.01:
    value: 15
    rationale: The benchmark defines the tested concept as the 'cheating rate', which is the pass rate on impossible tasks where passing implies a specification-violating shortcut.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2510.20270v1
        locator: 2510.20270v1 page 1, chunk 1
        quote: |-
          We measure an agent’s “cheating rate” as its pass rate
          on these impossible tasks, where any pass necessarily implies a specification-violating
          shortcut.
    by: model
    quotes_verified: true
  des.02:
    value: 15
    rationale: The benchmark translates the concept of cheating propensity into a task by creating 'impossible' versions of existing benchmarks where passing requires cheating.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2510.20270v1
        locator: 2510.20270v1 page 1, chunk 2
        quote: |-
          To measure and address such issues, we introduce   ImpossibleBench , a general and automated framework to
          quantify an LLM’s propensity to exploit test cases. The core idea is simple: we create “impossible” versions
    by: model
    quotes_verified: true
  des.03:
