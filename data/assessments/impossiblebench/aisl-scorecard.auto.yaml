  cor.07:
    value: unmet
    by: model
    rationale: "The tasks are intentionally unsolvable (impossible). While the 'correct' behavior is defined as cheating, the excerpts do not provide verified ground-truth solutions in the sense of an oracle solver passing a solvable task, but rather examples of how models cheat. The decision rule requires reference solutions checked by an oracle or second person for *solvable* tasks. Since these are unsolvable, this item might be n/a, but the n/a condition is 'not allowed'. However, the rule says 'For solvable tasks...'. Since there are no solvable tasks documented as such (they are all impossible), this item is technically not applicable to the *solvable* subset, but the n/a rule is forbidden. Let's re-read cor.07 n/a: 'not allowed for this item'. This implies we must judge it met or unmet. The principle is 'Each task has a verified end state'. The end state for impossible tasks is 'cheating'. Is there a 'verified ground-truth solution'? The paper provides 'verified deceptive solutions' (p1#1). But cor.07 specifically asks for 'solvable tasks'. If there are no solvable tasks, does it fail? Or is it unmet because no solvable tasks exist? The rule says 'For solvable tasks, provide...'. If there are none, the condition is vacuously true? No, usually benchmarks require *some* solvable tasks or explicit handling. However, looking at cor.06, it says 'Classify each task as solvable or intentionally unsolvable'. Cor.07 says 'For solvable tasks...'. If the benchmark contains *only* unsolvable tasks, then there are no solvable tasks to provide solutions for. This is a tricky edge case. However, the excerpts show 'LiveCodeBench' and 'SWE-bench' as base benchmarks which *are* solvable, but ImpossibleBench *mutates* them to be impossible. The paper says 'we modify the test cases... to produce direct conflicts'. It does not seem to include the original solvable tasks in the final benchmark evaluation in the same way, or if it does, it doesn't document the ground truth solutions for the *original* solvable tasks in the provided excerpts. The excerpts focus on the *impossible* variants. Therefore, for the tasks in ImpossibleBench, there are no solvable tasks. If the rule applies only to solvable tasks, and there are none, it might be considered met vacuously, but typically 'unmet' is safer if documentation is missing for the *concept* of solvable tasks. Let's look at cor.06 again. It requires classifying *each* task. The excerpts say 'create impossible versions'. It doesn't explicitly say 'we also include solvable tasks'. If the benchmark is *only* impossible tasks, then cor.07's condition 'For solvable tasks' never triggers. But the n/a is not allowed. This suggests the benchmark *should* have solvable tasks or the item is unmet because the 'verified end state' for a solvable task is not provided (because there are none?). Actually, if there are no solvable tasks, the requirement 'For solvable tasks, provide...' is trivially satisfied. However, in benchmark quality assessment, if a benchmark is purely adversarial/unsolvable, it often fails standard correctness checks designed for general benchmarks. Let's look for evidence of solvable tasks. Excerpt p3#2 says 'we use two popular coding benchmarks... as our base benchmarks... we modify the test cases'. It doesn't explicitly say the original solvable tasks are part of the *ImpossibleBench* evaluation suite, or if they are, it doesn't document their solutions. Given the strict 'n/a not allowed', and the lack of evidence for solvable tasks or their solutions, 'unmet' is the most defensible position as the documentation for 'solvable tasks' is missing (either because they don't exist or aren't documented)."
