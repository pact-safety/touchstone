    evidence: []
    quotes_verified: true
  cv.10:
    value: met
    rationale: The item count is stated as 313, and a confidence interval calculation is provided to justify the sample size.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 10, chunk 1
        quote: the size of our dataset (313 forbidden prompts) balances cost and runtime against comprehensiveness
    by: model
    quotes_verified: true
  cv.11:
    value: unmet
