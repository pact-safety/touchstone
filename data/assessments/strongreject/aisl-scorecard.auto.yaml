verdicts:
  cv.01:
    value: met
    rationale: The documentation defines the target phenomenon as the extent to which responses provide useful information related to a forbidden prompt, specifying that a full score requires specific information that fully answers the prompt.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 3, chunk 2
        quote: The StrongREJECT automated evaluator scores responses based on the extent to which they provide useful information related to the forbidden prompt.
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The scope is limited to LLMs, and the documentation explicitly states that multimodal models are excluded/unclear.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 10, chunk 1
        quote: First, we limit our scope to LLMs, so it is unclear whether StrongREJECT would be an appropriate benchmark for multimodal models.
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    rationale: The paper mentions dimensions of 'willingness and capabilities', but does not provide independent reported scores for these facets in a table or figure.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: met
    rationale: The task space is defined by six categories of harmful behavior, and the total item count (313) is reported.
    evidence:
      - source: repo
        url: https://github.com/alexandrasouly/strongreject/tree/f7cad6c17e624e21d8df2278e918ae1dddb4cb56
        locator: alexandrasouly/strongreject@f7cad6c17e62:README.md, chunk 1
        quote: the full dataset of 313 questions
    by: model
    quotes_verified: true
  cv.05:
