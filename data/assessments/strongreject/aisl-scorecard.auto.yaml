    rationale: The authors describe a quality filtering pipeline for existing datasets that includes category selection, deduplication, and non-refusal checks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 18, chunk 1
        quote: To address the issues with previous forbidden prompt databases, we created a robust pipeline to curate a high-quality set of forbidden prompts.
    by: model
    quotes_verified: true
  cv.07:
    value: unmet
    rationale: There is no mention of a named subset of boundary, perturbed, or adversarial items with a stated size and membership criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: unmet
