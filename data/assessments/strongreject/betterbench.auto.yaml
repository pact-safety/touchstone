verdicts:
  des.01:
    value: 15
    rationale: The benchmark defines the tested concept as measuring both the willingness and capabilities of a model to provide useful information related to forbidden prompts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 3, chunk 2
        quote: "the StrongREJECT evaluator measures both of these dimensions: willingness and capabilities."
    by: model
    quotes_verified: true
  des.02:
    value: 15
    rationale: "The text describes how the concept translates to a task: scoring responses based on the extent to which they provide useful information related to a forbidden prompt."
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 3, chunk 2
        quote: The StrongREJECT automated evaluator scores responses based on the extent to which they provide useful information related to the forbidden prompt.
    by: model
    quotes_verified: true
  des.03:
    value: 15
    rationale: The text explains that reliable evaluations are needed for safety researchers to identify which jailbreaks increase model misuse potential.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 2, chunk 2
        quote: In general, safety researchers need more reliable evaluations to identify which jailbreaks increase model misuse potential.
    by: model
    quotes_verified: true
  des.04:
    value: 10
