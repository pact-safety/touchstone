        locator: 2402.10260v2 page 17, chunk 2
        quote: We have, therefore, avoided questions that include details of child abuse, sexual abuse, animal abuse, torture, and murder.
      - source: paper
        url: https://arxiv.org/abs/2402.10260v2
        locator: 2402.10260v2 page 10, chunk 1
        quote: First, we limit our scope to LLMs, so it is unclear whether StrongREJECT would be an appropriate benchmark for multimodal models.
    by: model
    quotes_verified: true
