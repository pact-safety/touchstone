      - source: paper
        url: https://arxiv.org/abs/2408.08926v4
        locator: 2408.08926v4 page 2, chunk 3
        quote: CTF challenges are a broad class of cybersecurity tasks where the objective is to identify one or more vulnerabilities and execute one or more exploits to retrieve a secret string known as a flag
    by: model
    quotes_verified: true
