verdicts:
  c1:
    value: met
    rationale: The benchmark has a high difficulty ceiling, and current top models cannot solve the most challenging tasks that take human experts multiple hours.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2408.08926v4
        locator: 2408.08926v4 page 39, chunk 2
        quote: there are limits to model capabilities that prevent agents from solving the more challenging tasks that take human experts multiple hours to solve
    by: model
    quotes_verified: true
  c2:
    value: unmet
    by: model
    rationale: The excerpts do not document any contamination defence (such as private splits or canary strings) nor do they report a contamination check or overlap analysis. The paper notes that other datasets risk train-test overlap but does not provide evidence that Cybench has remedied this or verified its own contamination status.
    evidence:
      - source: paper
        quote: as each dataset is drawn from a single competition, there are only a limited number of recent tasks, risking train test overlap.
        locator: 2408.08926v4 page 10, chunk 0
        url: https://arxiv.org/abs/2408.08926v4
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  c3:
    value: unmet
    by: model
    rationale: The excerpts do not report the label or answer distribution, nor do they provide a trivial baseline score to demonstrate that the benchmark is not skewed by class imbalance. Without this evidence, the condition for being free of statistical bias is not satisfied.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  c4:
    value: unmet
    rationale: The excerpts mention verifying that tasks are buildable and solvable via solution scripts and CI, but there is no cited audit or error analysis reporting a low annotation error rate for the labels/data.
    evidence: []
    by: model
    quotes_verified: true
  c5:
    value: unmet
    by: model
    rationale: The excerpts do not state that the task serves a specific capability that remains current, nor do they argue against the task being irrelevant or solved. The paper focuses on the selection of recent competitions (2022-2024) but does not explicitly address the criterion of task obsolescence or relevance to current model development in the required manner.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  c6:
    value: unmet
    by: model
    rationale: The excerpts explicitly state that the benchmark relies on simplifying assumptions that do not hold for real-world complexity, such as 'Small codebases' and tasks being 'Not drawn from real-world'. The rule requires that stated assumptions are not contradicted by the current context, but here the paper admits the tasks are 'not actually real-world' and 'do not typically capture this complexity'.
    evidence:
      - source: paper
        quote: Small codebases. CTF tasks typically involve a few files of tens to hundreds of lines to code. In reality, systems can include thousands or hundreds of thousands of files... CTF tasks do not typically capture this complexity.
        locator: 2408.08926v4 page 39, chunk 3
        url: https://arxiv.org/abs/2408.08926v4
      - source: paper
        quote: Not drawn from real-world. CTF tasks are created specifically for competitions... they are not actually real-world.
        locator: 2408.08926v4 page 40, chunk 0
        url: https://arxiv.org/abs/2408.08926v4
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  c7:
    value: unmet
    by: model
    rationale: The excerpts do not show a maintenance process or revision that addresses meaning drift. The benchmark uses static tasks from competitions released between 2022 and 2024, but there is no evidence of a process to refresh items or address semantic drift over time.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  r1:
    value: unmet
    rationale: The provided excerpts do not show an explicit version identifier (like a DOI or release tag) displayed alongside the benchmark name in its main references.
    evidence: []
    by: model
    quotes_verified: true
  r2:
    value: unmet
    rationale: There is no mention of a deprecation plan or a policy for archiving artifacts at the end of the benchmark's life.
    evidence: []
    by: model
    quotes_verified: true
