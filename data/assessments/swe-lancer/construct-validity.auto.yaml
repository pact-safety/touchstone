  ru.3:
    value: unmet
    by: model
    rationale: While performance is compared against SWE-Bench Verified (38.8% vs 8%), the rule requires comparing performance on the *new* benchmark against the *original* benchmark. The text compares SWE-Lancer performance to SWE-Bench performance, which is a comparison between two different benchmarks, not the same benchmark before and after adaptation. However, the rule 'report and compare performance on the new benchmark against the original' usually implies if you adapt a dataset, you show how it performs on the old version vs new. Here, SWE-Lancer is a new dataset, not an adaptation of SWE-Bench's data. The text says 'Unlike prior benchmarks... SWE-Lancer evaluates...'. It does not reuse SWE-Bench's dataset. Therefore, the condition 'No prior dataset or benchmark is reused' applies to ru.2, ru.3, ru.4. Wait, ru.1 says 'Document whether the benchmark adapts a previous dataset'. SWE-Lancer does not adapt SWE-Bench; it creates new tasks from Upwork. So ru.1 is met by stating it is different. ru.2, ru.3, ru.4 have n/a conditions if no prior dataset is reused. Let's re-read ru.1. 'Document whether the benchmark adapts a previous dataset or benchmark'. SWE-Lancer does not adapt SWE-Bench. It is a new benchmark. So the answer to 'does it adapt' is 'No'. The documentation states this by contrasting it. So ru.1 is met. Since it does not reuse/adapt, ru.2, ru.3, ru.4 are n/a.
