        locator: 2502.12115v4 page 6, chunk 1
        url: https://arxiv.org/abs/2502.12115v4
    quotes_verified: true
  cv.17:
    value: met
    rationale: The documentation reports named failure categories (e.g., poor instruction following, giving up early) for open-source models.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 38, chunk 2
        quote: Below, we summarize the common failure modes we observed from Deepseek-R1 and Llama 3.3 70B
    by: model
    quotes_verified: true
  cv.18:
    value: met
    by: human
    rationale: The docs contain statements naming the tasks (IC SWE, SWE Manager), metrics (pass@1, earnings), and the construct (real-world software engineering capability) they measure, with reasons.
    evidence:
      - source: paper
        quote: We track the percent of tasks resolved and the total payout earned by the model
        locator: 2502.12115v4 page 4, chunk 1
        url: https://arxiv.org/abs/2502.12115v4
    quotes_verified: true
  cv.19:
    value: met
    rationale: The benchmark is compared to SWE-Bench Verified, noting that SWE-Lancer improves upon it by including open-ended problems and full-stack development.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 15, chunk 3
        quote: on SWE-Bench Verified... GPT-4o currently scores 38.8%... but only 8% on SWE-Lancer Diamond IC SWE tasks – likely because SWE-Bench Verified focuses on bugfixes, and SWE-Lancer includes open-ended problems
    by: model
    quotes_verified: true
  cv.20:
    value: met
    rationale: The docs provide a limitations statement regarding repository diversity and link performance to real-world economic value/automation potential.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 10, chunk 0
        quote: SWE-Lancer provides a concrete framework to start tying model capabilities to potential real-world software automation potential
    by: model
    quotes_verified: true
  iv.01:
    value: unmet
    rationale: While the paper mentions ablations on tool affordances, it does not name specific secondary capabilities (like reading comprehension) and provide control conditions or results showing they do not drive scores.
    evidence: []
    by: model
    quotes_verified: true
  iv.02:
    value: unmet
    by: model
