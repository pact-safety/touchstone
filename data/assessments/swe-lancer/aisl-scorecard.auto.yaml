        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 1, chunk 3
        quote: SWE-Lancer evaluates IC SWE tasks using end-to-end tests created by a team of professional software engineers.
    by: model
    quotes_verified: true
  cv.15:
    value: n/a
