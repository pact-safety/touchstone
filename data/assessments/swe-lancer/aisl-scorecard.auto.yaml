    value: unmet
    rationale: The documentation does not quantify the overlap with related phenomena or describe specific mitigation steps for that overlap.
    evidence: []
    by: model
    quotes_verified: true
  iv.04:
    value: unmet
    rationale: The paper specifies a JSON output format for manager tasks but does not report results under different format conditions or separate format-failure rates.
    evidence: []
