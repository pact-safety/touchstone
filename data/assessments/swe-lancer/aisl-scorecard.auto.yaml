verdicts:
  cv.01:
    value: met
    rationale: The benchmark defines the target phenomenon as real-world freelance software engineering work, with observable evidence being the generation of code patches for IC SWE tasks and the selection of the best proposal for SWE Manager tasks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 9, chunk 2
        quote: a benchmark for evaluating model performance on real-world, freelance software engineering work.
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The documentation specifies the scope as full-stack engineering work and explicitly excludes infrastructure engineering tasks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 8, chunk 4
        quote: infrastructure engineering tasks (e.g. refining Kubernetes cluster architectures and debugging pod failures, node crashes, or networking problems) are underrepresented
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    by: model
    rationale: The documentation does not report separate scores for distinct facets (e.g., factual accuracy vs. tone) in a table or figure; it reports aggregate pass rates and earnings for IC SWE and SWE Manager tasks.
    evidence:
      - source: paper
        quote: Table 3. Diamond Task Pass Rates by Nature of Work
        locator: 2502.12115v4 page 13, chunk 0
        url: https://arxiv.org/abs/2502.12115v4
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.04:
    value: met
    rationale: The task space is defined by categories (e.g., Bug Fixes, New Features) and item counts are reported for these categories.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 29, chunk 0
        quote: Table 7. Number of tasks by task nature within SWE-Lancer Diamond and SWE-Lancer Full datasets.
    by: model
    quotes_verified: true
  cv.05:
    value: met
    by: model
    rationale: The documentation reports per-category item counts over the documented task space in Tables 7 and 8, showing the distribution of tasks by nature and price range.
    evidence:
      - source: paper
        quote: Table 7. Number of tasks by task nature within SWE-Lancer Diamond and SWE-Lancer Full datasets.
        locator: 2502.12115v4 page 29, chunk 0
        url: https://arxiv.org/abs/2502.12115v4
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.06:
    value: met
    rationale: Tasks were screened by at least three experienced human software engineers based on specific criteria, and a rating system was used to verify they were well-specified.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 16, chunk 1
        quote: Each task in our final set was screened by at least three experienced human software engineers.
    by: model
    quotes_verified: true
  cv.07:
    value: unmet
    rationale: There is no mention of a named subset of boundary, perturbed, or adversarial items with a stated size and membership criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: unmet
    by: model
    rationale: The documentation compares SWE-Lancer to prior benchmarks qualitatively and by model performance on different benchmarks, but does not provide a table or figure comparing the same model on the original dataset and the adapted benchmark.
    evidence:
      - source: paper
        quote: Table 5. Comparison of SWE-Lancer to existing coding and SWE-related benchmarks
        locator: 2502.12115v4 page 15, chunk 0
        url: https://arxiv.org/abs/2502.12115v4
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.09:
    value: unmet
    by: model
    rationale: The documentation does not list modifications made to reused data with their reasons; it describes sourcing new data from Upwork and Expensify.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.10:
    value: unmet
    rationale: While item counts are provided, there is no power calculation or confidence-interval half-width compared to the smallest model gap.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.11:
    value: unmet
    rationale: Confidence intervals are reported for earnings for some models, but not for every score in the main results tables.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 8, chunk 2
        quote: The 95% confidence interval for GPT-4o was $194.31 ± $17.31, while o1’s was $1,623.76 ± $56.68.
    by: model
    quotes_verified: true
  cv.12:
    value: met
    rationale: The documentation reproduces the rubric used by human engineers to rate if an issue was well-specified.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2502.12115v4
        locator: 2502.12115v4 page 17, chunk 0
        quote: Please assign a rating from 0 to 3 using the rubric below. 0- The issue is well-specified, and it is clear what is required for a successful solution.
    by: model
    quotes_verified: true
  cv.13:
    value: unmet
    rationale: Rater demographics are not reported, nor is there a check for demographic skew.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.14:
