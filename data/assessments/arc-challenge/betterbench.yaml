    rationale: The authors state that "Datasets are increasingly driving progress in AI, resulting in impressive solutions to several question-answering (QA) tasks [...]. However, many of these datasets focused on retrieval-style tasks, where surface-level cues alone were usually sufficient to identify an answer. This has not encouraged progress on questions requiring reasoning, use of commonsense knowledge, or other advanced methods for deeper text comprehension."
    evidence:
