    rationale: 'Limitations to both the design and applicability are discussed in the paper. Ex: "Although these descriptions of reasoning paths are informal, and clearly many others are possible, they illustrate that the ARC Corpus mentions knowledge relevant to a question, even if no single sentence alone provides the answer. Of course, this does not address the challenge of correctly identifying and reasoning with this knowledge, nor the challenge of injecting unstated commonsense knowledge that may also be required. Rather, our claim is that the Corpus contains substantial linguistic signal relevant to most of the ARC questions, and is a useful starting point for corpusbased attacks on the Challenge"'
