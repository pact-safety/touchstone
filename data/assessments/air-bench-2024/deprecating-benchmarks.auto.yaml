        url: https://arxiv.org/abs/2407.17436v2
        locator: 2407.17436v2 page 2, chunk 3
        quote: To bridge this critical gap, we introduce AIR-B ENCH 2024, a comprehensive language model (LM) safety benchmark consisting of 5,694 risky instruction prompts directly grounded in the current regulatory landscape.
    by: model
    quotes_verified: true
