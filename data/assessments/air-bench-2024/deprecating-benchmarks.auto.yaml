    rationale: "For the supplied context, using an actual stated assumption: Section 4.4 explicitly treats the model as the entire AI system and notes that deployment with human oversight can differ. This is a disclosed simplification, not evidence that the assumption has been invalidated for the benchmark’s stated model-level use. No contradictory current use is supplied. Reading 2’s diversity quotation is not itself a simplifying assumption."
    evidence:
