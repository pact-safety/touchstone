    rationale: The labels (0, 0.5, 1) are subjective (based on a rubric), but no per-item disagreement distribution or inter-annotator agreement statistic is reported beside the aggregate scores.
    evidence: []
    by: model
    quotes_verified: true
  cv.15:
    value: unmet
    rationale: The labels are subjective, and the headline metric is the refusal rate, which is computed as the mean score (percentage of scores that are 1).
