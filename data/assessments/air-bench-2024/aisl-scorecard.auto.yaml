verdicts:
  cv.01:
    value: met
    rationale: The benchmark defines the target phenomenon (safety alignment) through a scoring system where a score of 1 represents a refusal to generate harmful content.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2407.17436v2
        locator: 2407.17436v2 page 6, chunk 0
        quote: 1   is awarded for refusals to generate harmful content or assist with the requested task
    by: model
    quotes_verified: true
  cv.02:
    value: unmet
    rationale: While the benchmark defines what is in scope (314 risk categories), it does not explicitly name an aspect of the phenomenon that is excluded.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.03:
    value: unmet
    rationale: The paper mentions 314 risk categories and level-4 categories, but the provided excerpts do not show a table or figure where every single sub-component has its own reported score.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: unmet
    rationale: The docs define the task space (314 unique granular risks), but they do not report item counts along a difficulty or variation dimension.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.05:
    value: unmet
    rationale: The documentation does not report per-category item counts or a stratified sampling plan; it only mentions a total of 5,694 prompts.
    evidence: []
    by: model
    quotes_verified: true
  cv.06:
    value: met
    rationale: The judge prompts were checked by humans, and the paper describes the proportion of human-edited versus model-generated prompts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2407.17436v2
        locator: 2407.17436v2 page 6, chunk 0
        quote: finally checked by humans, with approximately 70% of the final judge prompts being model-generated and 30% human-edited
    by: model
    quotes_verified: true
  cv.07:
    value: unmet
    rationale: While the paper mentions 'mutated versions' and 'uncommon dialects' to stress-test models, it does not provide a named subset of boundary/adversarial items with a stated size and membership criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: n/a
    rationale: The benchmark creates its own set of 5,694 risky instruction prompts grounded in regulations rather than reusing an existing dataset.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2407.17436v2
        locator: 2407.17436v2 page 2, chunk 3
        quote: we introduce AIR-B ENCH   2024, a comprehensive language model (LM) safety benchmark consisting of   5,694   risky instruction prompts
    by: human
    quotes_verified: true
  cv.09:
    value: n/a
    rationale: The benchmark does not reuse a prior dataset.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2407.17436v2
        locator: 2407.17436v2 page 2, chunk 3
        quote: we introduce AIR-B ENCH   2024, a comprehensive language model (LM) safety benchmark consisting of   5,694   risky instruction prompts
    by: human
    quotes_verified: true
  cv.10:
    value: unmet
    rationale: The total item count is stated, but there is no power calculation or confidence-interval half-width reported.
    evidence: []
    by: model
    quotes_verified: true
  cv.11:
    value: unmet
    rationale: The results are reported as refusal rates (means), but no confidence intervals or standard errors are provided for the scores.
    evidence: []
    by: model
    quotes_verified: true
  cv.12:
    value: unmet
    rationale: The paper mentions that annotators used 'given scoring rules in Section 3.3', but the actual instructions or training materials are not reproduced in the excerpts.
    evidence: []
    by: model
    quotes_verified: true
  cv.13:
    value: unmet
