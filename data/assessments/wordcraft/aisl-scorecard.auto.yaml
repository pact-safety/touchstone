verdicts:
  cv.01:
    value: met
    rationale: The documentation defines the target phenomenon as the ability to make use of commonsense knowledge, with observable behavior being the agent's ability to choose entities to combine to create a goal entity.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2007.09185v1
        locator: 2007.09185v1 page 2, chunk 2
        quote: In order to benchmark the ability of RL agents to make use of commonsense knowledge, we present WordCraft
    by: model
    quotes_verified: true
  cv.02:
    value: unmet
    rationale: While the documentation describes what is in scope (text-based tasks based on Little Alchemy 2), it does not explicitly name an aspect of the phenomenon that is excluded.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.03:
    value: unmet
    rationale: The paper does not explicitly state the phenomenon is a single unitary construct, nor does it report independent scores for distinct facets of the phenomenon in a table or figure.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: met
    rationale: The task space is defined by goal entities and recipes, and item counts/difficulty are reported via the number of distractors and task depth.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2007.09185v1
        locator: 2007.09185v1 page 2, chunk 3
        quote: The task difficulty can be adjusted by increasing the number of distractors or increasing the number of intermediate entities
    by: model
    quotes_verified: true
  cv.05:
    value: unmet
    rationale: The documentation mentions random sampling of tasks but does not report per-category item counts or a stratified sampling plan over the task space.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.06:
