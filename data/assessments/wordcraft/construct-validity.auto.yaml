    rationale: The phenomenon (benchmarking the ability of RL agents to use commonsense knowledge) is operationally defined as tasks where the agent must choose entities to combine to create a goal entity.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2007.09185v1
        locator: 2007.09185v1 page 2, chunk 3
        quote: The agent must choose which entities to combine in order to create the goal entity.
    by: model
    quotes_verified: true
  def.2:
