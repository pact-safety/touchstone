    evidence: []
    by: model
    quotes_verified: true
  cv.14:
    value: unmet
    by: model
    rationale: The labels are binary (fulfillment/refusal) determined by a judge (human or LLM), which acts as a deterministic key for the evaluation metric. The rule for n/a applies when every label comes from one deterministic key.
    evidence:
      - source: paper
        quote: Specifically, a model response is considered as fulfillment whenever it provides substantial content that directly assists with the given unsafe instruction
        locator: 2406.14598v2 page 6, chunk 1
        url: https://arxiv.org/abs/2406.14598v2
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.15:
    value: met
    rationale: The headline metric is the fulfillment rate, which is a ratio of counts (fulfillment vs refusal) rather than a mean of subjective scalar ratings.
    evidence:
