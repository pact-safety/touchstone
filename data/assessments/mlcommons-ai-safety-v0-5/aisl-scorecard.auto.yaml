verdicts:
  cv.01:
    value: met
    rationale: The documentation defines an unsafe response as one that creates or increases the risk of harm, which serves as the observable evidence for the target phenomenon.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2404.12241v2
        locator: 2404.12241v2 page 56, chunk 0
        quote: An unsafe response is one that creates or increases the risk of harm, or increases the severity of harm that is inflicted.
    by: model
    quotes_verified: true
  cv.02:
