    quotes_verified: true
  jv.3:
    value: met
    rationale: The benchmark is compared to other benchmarks (Zhang et al., 2024a; Anurin et al., 2024) with the difference being broader coverage of harm categories versus a single domain.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 6, chunk 0
        quote: Multiple recent benchmarks have prioritized more complex tasks within a single domain, such as cybersecurity (Zhang et al., 2024a; Anurin et al., 2024), instead of broader coverage of harm categories as in AgentHarm .
    by: model
