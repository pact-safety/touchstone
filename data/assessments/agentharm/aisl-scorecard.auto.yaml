verdicts:
  cv.01:
    value: met
    rationale: The benchmark defines its target as the 'propensity and ability of LLM agents to complete such harmful tasks', where evidence is the successful execution of multi-step tool calls.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 1, chunk 3
        quote: aims to measure the propensity and ability of LLM agents to complete such harmful tasks
    by: model
    quotes_verified: true
  cv.02:
    value: unmet
    rationale: While the documentation describes what is in scope (11 harm categories), it does not explicitly name an aspect of the phenomenon that is excluded.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.03:
    value: met
    rationale: The phenomenon is broken down into harm categories, and the docs state that average harm scores per category are reported in Figure 7.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 10, chunk 2
        quote: Figure 7 shows the breakdown of average harm scores per category for GPT-4o-mini and GPT-4o.
    by: human
    quotes_verified: true
  cv.04:
    value: met
    rationale: The task space is defined by 11 harm categories, and item counts are reported across difficulty variations (detailed, open-ended, and hint-included).
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 2, chunk 0
        quote: We collect 110 unique and 330 augmented agentic behaviors across 11 harm categories
    by: model
    quotes_verified: true
  cv.05:
    value: unmet
    rationale: The docs mention the number of behaviors across categories but do not report the specific per-category item counts or a stratified sampling plan.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.06:
    value: met
    rationale: Every question was written by hand and reviewed by a separate human reviewer.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 6, chunk 2
        quote: we write all questions by hand and review every question with a separate human reviewer
    by: model
    quotes_verified: true
  cv.07:
    value: unmet
    rationale: There is no mention of a specific named subset of boundary, perturbed, or adversarial items with a stated size and membership criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: n/a
    rationale: The benchmark does not reuse a prior dataset; it states it is the first to measure direct prompting for multi-step agent misuse.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 2, chunk 0
        quote: In addition to being the first dataset to specifically measure direct prompting scenarios for multi-step agent misuse
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.09:
    value: n/a
    rationale: The benchmark does not reuse a prior dataset.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 2, chunk 0
        quote: In addition to being the first dataset to specifically measure direct prompting scenarios for multi-step agent misuse
    by: model
    quotes_verified: true
  cv.10:
    value: unmet
    rationale: While item counts are provided, there is no power calculation or confidence-interval half-width reported.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.11:
    value: unmet
    rationale: The main results table (Table 2) provides some standard deviations for one model, but not for every score in the main results.
    evidence: []
    by: model
    quotes_verified: true
  cv.12:
    value: unmet
    by: model
    rationale: The paper mentions human reviewers for dataset creation but does not publish or reproduce specific rater instructions or training materials for those reviewers.
    evidence:
      - source: paper
        quote: we write all questions by hand and review every question with a separate human reviewer who did not write the question.
        locator: 2410.09024v3 page 6, chunk 2
        url: https://arxiv.org/abs/2410.09024v3
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.13:
    value: n/a
    rationale: No human raters label the outputs for the final scores.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 2, chunk 1
        quote: reliably scored , with human-written rubrics requiring LLM judges only for narrow well-specified subtasks
    by: model
    quotes_verified: true
  cv.14:
    value: unmet
    by: model
    rationale: The labels are deterministic based on rubrics (function calls, correct parameters) or LLM judges on narrow criteria, not subjective human ratings requiring inter-annotator agreement distributions.
    evidence:
      - source: paper
        quote: The majority of our grading criteria checks are predefined, manually written conditions, e.g., if a function that sends money is called with the right credit card number.
        locator: 2410.09024v3 page 5, chunk 2
        url: https://arxiv.org/abs/2410.09024v3
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.15:
    value: n/a
    rationale: The labels are based on deterministic rubric checks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 5, chunk 2
        quote: The majority of our grading criteria checks are predefined, manually written conditions
    by: model
    quotes_verified: true
  cv.16:
    value: unmet
    rationale: The error analysis mentioned in the text does not provide a table or figure breaking down failures by a named confound like length or complexity.
    evidence: []
    by: model
    quotes_verified: true
  cv.17:
    value: unmet
    rationale: The docs mention identifying examples through manual inspection, but do not report named failure categories with counts or shares.
    evidence: []
    by: model
    quotes_verified: true
  cv.18:
    value: unmet
    rationale: The docs do not contain a single statement that names the tasks, each metric, and the construct from cv.01 with a stated reason.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.19:
    value: met
    rationale: The benchmark compares itself to domain-specific agentic benchmarks, noting that those have smaller sample sizes (10-30 tasks) compared to AgentHarm's 110 base tasks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 6, chunk 1
        quote: existing domain-specific agentic benchmarks have a small sample size on the order of 10-30 tasks compared to our 110 base and 440 augmented tasks
    by: model
    quotes_verified: true
  cv.20:
    value: met
    rationale: The docs provide a limitation regarding English-only prompts and claim that the benchmark's complexity provides a signal of real misuse potential.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 10, chunk 2
        quote: The prompts are only in English, and do not consider other languages
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 14, chunk 0
        quote: We believe the complexity and realism of this benchmark are sufficient to provide a signal of the model’s real misuse potential
    by: model
    quotes_verified: true
  iv.01:
    value: unmet
    rationale: The documentation does not identify specific secondary capabilities nor provide control conditions or ablation results for them.
    evidence: []
    by: model
    quotes_verified: true
  iv.02:
    value: unmet
    by: model
    rationale: The excerpts do not name related phenomena that could be measured by the same tasks, only distinguishing AgentHarm from chatbot benchmarks.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.03:
    value: unmet
    rationale: There is no quantification of the overlap with agentic competencies or description of mitigation steps for this overlap.
    evidence: []
    by: model
    quotes_verified: true
  iv.04:
    value: unmet
    rationale: The excerpts do not report results under different output-format conditions or separate format-failure rates from task failures.
    evidence: []
    by: model
    quotes_verified: true
  iv.05:
    value: unmet
    rationale: No prompt-perturbation experiment with a variance or spread measure is reported.
    evidence: []
    by: model
    quotes_verified: true
  iv.06:
    value: unmet
    by: model
    rationale: The scoring involves parsing free-form output (function calls, text), so the n/a condition does not hold, and no parser bias analysis is reported.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.07:
    value: unmet
    rationale: The paper does not report overlap/contamination check results or training cutoffs for every evaluated model (e.g., GPT-4o, Sonnet 3.5, Mistral Large 2).
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.08:
    value: met
    rationale: For the task environment, with a stronger source than Reading 2 cites. Section 3.1.2 describes all tools as standalone, side-effect-free synthetic functions with prepared return content; these simulate services rather than depending on changing live web data. This supports the fixed-environment branch of the rule, not N/A. The realism/optimization quote in Reading 2 does not establish this., Section 3.1.2.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: Section 3.1.2
    by: human
  iv.09:
    value: unmet
    rationale: There is no mention of resetting state, containers, or processes between evaluation runs.
    evidence: []
    by: model
    quotes_verified: true
  iv.10:
    value: met
    rationale: The benchmark uses open-ended tasks and grading rubrics rather than multiple-choice questions.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 4, chunk 3
        quote: We additionally present an open-ended variant, which omits certain details to make the task more challenging
    by: model
    quotes_verified: true
  ev.01:
    value: unmet
    rationale: The documentation does not name specific domain experts or user groups consulted to define scenarios and criteria.
    evidence: []
    by: model
    quotes_verified: true
  ev.02:
    value: unmet
    by: model
    rationale: While the docs mention 'separate human reviewers' (paper:p2#1) and 'manual inspection' (paper:p6#2), they do not name the reviewers' field or credentials, nor do they state whether all items or a specific sample size were reviewed.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  ev.03:
    value: met
    rationale: Results are reported for multiple prompting settings including chain-of-thought, ReAct, and refusal prompts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 8, chunk 2
        quote: "We explore the effect of different prompting techniques: chain-of-thought, ReAct, and a refusal-inducing prompt."
    by: model
    quotes_verified: true
  ev.04:
    value: unmet
    rationale: There is no report of results as a separate slice for a named stress condition or shift with an item count.
    evidence: []
    by: model
    quotes_verified: true
  ev.05:
    value: unmet
    by: model
    rationale: The benchmark uses 'synthetic tools' which are 'less realistic' and act as 'proxies for harm' (paper:p5#1). It does not state that the model, tools, prompt, and environment match a named deployed product or configuration; rather, it explicitly notes the synthetic nature of the evaluation.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  ev.06:
    value: unmet
    by: model
    rationale: "The n/a condition applies because the benchmark does not claim to evaluate a specific deployed application. It uses synthetic tools and acts as a proxy, explicitly stating: 'Using synthetic tools makes these tasks easier and less realistic, which means they act as proxies for harm as opposed to directly indicating harmful agent abilities.' (paper:p5#1). Therefore, it is not applicable to evaluate a specific deployed application's manipulation resistance."
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  ev.07:
    value: unmet
    by: model
    rationale: "The n/a condition applies because the benchmark does not claim to evaluate a specific deployed application. It uses synthetic tools and acts as a proxy, explicitly stating: 'Using synthetic tools makes these tasks easier and less realistic, which means they act as proxies for harm as opposed to directly indicating harmful agent abilities.' (paper:p5#1). Therefore, it is not applicable to document differences from a specific real deployment."
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  rel.01:
    value: unmet
    rationale: The documentation mentions temperature and output tokens, but lacks library versions, hardware models, and OS/container details.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 6, chunk 3
        quote: we use temperature 0 with up to 4096 generated output tokens
    by: model
    quotes_verified: true
  rel.02:
    value: unmet
    rationale: There is no mention of an independent third party reproducing the results on different infrastructure.
    evidence: []
    by: model
    quotes_verified: true
  rel.03:
    value: unmet
    rationale: While quality control steps (human review) are described, there is no mentioned correction channel like a changelog or errata recording a fix.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 6, chunk 2
        quote: we write all questions by hand and review every question with a separate human reviewer
    by: model
    quotes_verified: true
  rel.04:
    value: unmet
    rationale: The docs name flaws (e.g., grading functions missing traces), but do not state the direction of bias, impact estimate, or which conclusions remain valid.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 10, chunk 3
        quote: the grading functions can sometimes miss an alternative execution trace that can be considered correct
    by: model
    quotes_verified: true
  rel.05:
    value: unmet
    rationale: No human or expert baseline is reported for the tasks, nor is a named prior system reported as the reference point for the main tasks.
    evidence: []
    by: model
    quotes_verified: true
  rel.06:
    value: unmet
    rationale: No trivial baseline score (e.g., random or zero-shot naive) is reported.
    evidence: []
    by: model
    quotes_verified: true
  cor.01:
    value: unmet
    rationale: While the benchmark uses LLM judges for narrow subtasks, there is no reported correlation or agreement score between these model ratings and human judgments.
    evidence: []
    by: model
    quotes_verified: true
  cor.02:
    value: unmet
    by: model
    rationale: While the paper mentions mitigating risks of tricking the refusal judge, it does not report an adversarial or reward-hacking test of the model rater itself, nor does it describe a named defense like a fixed rubric for the rater's internal logic.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cor.03:
    value: unmet
    rationale: There is no report of agreement across repeated rating runs on the same inputs for the model rater.
    evidence: []
    by: model
    quotes_verified: true
  cor.04:
    value: unmet
    rationale: The docs mention that grading the whole output by an LLM can be problematic due to bias, but they do not measure a specific named bias with a number.
    evidence: []
