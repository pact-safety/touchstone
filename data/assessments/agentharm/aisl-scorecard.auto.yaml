        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 10, chunk 2
        quote: Figure 7 shows the breakdown of average harm scores per category for GPT-4o-mini and GPT-4o.
    by: model
    quotes_verified: true
  cv.04:
