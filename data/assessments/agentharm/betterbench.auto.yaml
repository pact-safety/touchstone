  des.01:
    value: 15
    rationale: The benchmark defines the tested concept as the performance of LLM agents executing multi-step tool calls to fulfill malicious user requests.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2410.09024v3
        locator: 2410.09024v3 page 2, chunk 0
        quote: AgentHarm evaluates the performance of LLM agents that have to execute multi-step tool calls to fulfill user requests.
    by: model
    quotes_verified: true
