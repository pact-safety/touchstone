verdicts:
  iv.01:
    value: met
    rationale: The benchmark states the number of prompts (12,000 per dataset) and documents the adoption of a mitigation to calibrate prompt count to statistical analysis.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: 2503.05731v2 page 14, chunk 1
        quote: The two datasets (practice and official) each include 12,000 prompts
      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: 2503.05731v2 page 39, chunk 0
        quote: "33: Calibrate prompt count to statistical analysis   Y"
    by: model
    quotes_verified: true
  iv.02:
    value: unmet
    rationale: While the benchmark mentions error bands and statistical analysis, it does not report a specific statistical power figure or minimum detectable difference.
    evidence: []
    by: model
    quotes_verified: true
  iv.03:
    value: unmet
    rationale: The excerpts do not provide the full prompt template, sampling settings (like max tokens), or the specific harness version.
    evidence: []
    by: model
    quotes_verified: true
  iv.04:
    value: unmet
    rationale: The excerpts mention prompt perturbation as a concept, but do not describe a specific control against a confound and its result.
    evidence: []
    by: model
    quotes_verified: true
  iv.05:
    value: met
    rationale: The benchmark uses a confidential official dataset to resist overfitting and explicitly documents the use of a private test set.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: 2503.05731v2 page 14, chunk 1
        quote: The official dataset is for grading SUTs and for reporting (see Section 6); it remains confidential to prevent or at least resist overfitting
    by: model
    quotes_verified: true
  iv.06:
    value: unmet
    rationale: There is no report of results from repeated runs with different seeds or varied conditions (e.g., prompt variants).
    evidence: []
    by: model
    quotes_verified: true
  iv.07:
    value: unmet
    by: human
    rationale: The excerpts describe the evaluator pipeline and error analysis in general terms, but do not report a manual inspection of specific model outputs or trajectories with sample sizes and findings.
    evidence: []
    quotes_verified: true
  iv.08:
    value: unmet
    by: model
    rationale: The excerpts mention human annotators and majority voting, but do not report inter-annotator agreement figures or describe blinding procedures for the annotators.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  iv.09:
    value: unmet
    rationale: The excerpts do not state that the benchmark releases full model outputs or reasoning traces for evaluators to read.
    evidence: []
    by: model
    quotes_verified: true
  iv.10:
    value: unmet
    rationale: There is no documentation of a check for evaluation awareness, sandbagging, or under-elicitation.
    evidence: []
    by: model
    quotes_verified: true
  iv.11:
    value: met
    rationale: The documentation describes the design process, data collection, and a detailed versioning system for maintenance.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: 2503.05731v2 page 45, chunk 0
        quote: "125: Benchmark design process is documented   Y"
      - source: repo
        url: https://github.com/mlcommons/ailuminate/tree/769cc2be9d20c8d4fb26ce53b68865ed41dfb8e2
        locator: mlcommons/ailuminate@769cc2be9d20:AILuminate Naming and Versioning.md, chunk 4
        quote: A normal version number MUST take the form X.Y.Z where X, Y, and Z are non-negative integers
    by: model
    quotes_verified: true
  ev.01:
    value: unmet
    rationale: The excerpts describe the interaction model (single-turn) and the target SUTs, but they do not provide a full description of the evaluation environment including input/output formats, available tools/sandboxes, or specific access restrictions.
    evidence: []
    by: model
    quotes_verified: true
  ev.02:
    value: met
    rationale: The documentation explicitly states that the benchmark does not use prompts from real user interactions and does not test sustained interactions with intricate contexts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: 2503.05731v2 page 22, chunk 0
        quote: It neither employs prompts recorded from real, unknowing user interactions... nor tests sustained interactions with intricate contexts.
    by: model
    quotes_verified: true
  ev.03:
    value: unmet
    by: model
    rationale: The excerpts mention that the benchmark assesses 12 hazard categories and supports multiple languages, but they do not provide counts or proportions for the spread of the evaluation along these axes, which is required by the decision rule.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  rp.01:
    value: unmet
    rationale: The excerpts do not report run-to-run variation or a statement that the authors reproduced their own headline numbers.
    evidence: []
    by: model
    quotes_verified: true
  rp.02:
    value: met
    rationale: The documentation explicitly states that the accompanying paper was accepted at a peer-reviewed venue.
    evidence:
