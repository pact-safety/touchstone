    evidence: []
    by: model
    quotes_verified: true
  rp.08:
    value: unmet
    by: model
    rationale: The excerpts do not state that the harness runs models through public APIs or open weights, nor that it is built on or exported to a named public evaluation framework or standard format. It mentions accessing some SUTs through APIs, but does not confirm the harness itself uses public APIs or standards for the evaluation process.
