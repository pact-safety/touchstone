    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  rp.03:
    value: unmet
    by: model
    rationale: The test items (prompts) are not publicly downloadable. Access is restricted to MLCommons members via a form and verification process, which does not satisfy the requirement for obtainability by outside researchers via public download or documented access-controlled request for general research.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  rp.04:
    value: unmet
    by: model
    rationale: While the harness (ModelBench) is mentioned, the excerpts do not confirm that the scoring code and grader prompts are released in a repository runnable against a new model without the authors' help. The evaluator is described as a 'response evaluator based on specialized models', implying a proprietary or closed component not fully open for independent execution.
    evidence:
      - source: paper
        quote: "The evaluator system is standalone software that manages the entire SUT evaluation life cycle. Called ModelBench... it includes the following components: 1. A prompt database... 2. A benchmark runner... 3. A benchmark-run-journal data store... 4. A report generator"
        locator: 2503.05731v2 page 16, chunk 1
        url: https://arxiv.org/abs/2503.05731v2
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  rp.05:
