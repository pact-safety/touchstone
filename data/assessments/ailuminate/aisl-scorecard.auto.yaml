  cv.01:
    value: met
    rationale: The documentation defines the target phenomenon as the reinforcement of binary-gender stereotypes and specifies that evidence is the difference between sentiment-analysis scores for model responses to stereotype vs anti-stereotype prompts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: 2503.05731v2 page 25, chunk 0
        quote: "the focus of this work is on social-bias harms in generative AI systems: specifically, the reinforcement of binary-gender stereotypes in the outputs of text-to-text language models."
    by: model
    quotes_verified: true
