      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: Section 3
    by: human
  des.08:
    value: 15
    rationale: Supported by Sections 5.6 and 6 rather than the checklist statement. The paper explains the priority on detecting rare policy violations and motivates overall/hazard-specific grades, accessible-system calibration and understandable decision support. Documenting a metric alone would not demonstrate an informed choice.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2503.05731v2
        locator: Sections 5.6
    by: human
