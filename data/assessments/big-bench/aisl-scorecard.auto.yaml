verdicts:
  cv.01:
    value: unmet
    rationale: The documentation describes the goal of the benchmark and criteria for tasks, but does not provide a precise operational definition of the target phenomenon stating which observable outputs count as evidence.
    evidence: []
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The documentation states that tasks measuring almost any aspect of LLM capabilities are in-scope, and the paper explicitly names multi-modal capabilities as a limit/exclusion.
    evidence:
      - source: repo
        url: https://github.com/google/BIG-bench/tree/092b196c1f8f14a54bbc62f24759d43bde46dd3b
        locator: google/BIG-bench@092b196c1f8f:docs/doc.md, chunk 2
        quote: Tasks which measure almost any aspect of large language model capabilities are in-scope for this benchmark
      - source: paper
        url: https://arxiv.org/abs/2206.04615v3
        locator: 2206.04615v3 page 8, chunk 2
        quote: BIG-bench is designed for evaluating pure language models and has limits to cover multi-modal capabilities
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    rationale: The benchmark consists of many tasks with different facets (e.g., social bias, calibration), but the excerpts do not show that every named sub-component has its own reported score in a table or figure.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: unmet
    rationale: While the docs mention that tasks with varying difficulty are encouraged, they do not define the overall task space categories and report item counts along a difficulty dimension.
