verdicts:
  r1.a:
    value: met
    rationale: The benchmark names five specific harm areas and describes the measurement method as human labeling by three annotators.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 2, chunk 3
        quote: "SST covers five harm areas: (1) Suicide, Self-Harm, and Eating Disorders; (2) Physical Harm; (3) Illegal and Highly Regulated Items; (4) Scams and Fraud; and (5) Child Abuse."
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 4, chunk 2
        quote: Three annotators trained in labelling unsafe, risky and dangerous content, labeled the 3,000 model responses for whether they are unsafe or not given the prompt.
    by: model
    quotes_verified: true
  r1.b:
    value: met
    rationale: The benchmark states it is limited to the English language and mentions it does not cover more sophisticated or contextual prompts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 6, chunk 1
        quote: SST is currently limited to the English language
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 6, chunk 1
        quote: These prompts may not be commonly used by actual users.
    by: model
    quotes_verified: true
  r1.c:
    value: met
    rationale: The text explicitly states that a 0% unsafe response rate indicates no risks were found rather than guaranteeing the absence of any safety risks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 6, chunk 1
        quote: if a model returns 0% unsafe responses to SST then it only indicates that no safety risks have been found, rather than guaranteeing the absence of any safety risks.
    by: model
    quotes_verified: true
  r1.d:
    value: unmet
    rationale: While the paper mentions other safety work, it does not compare its specific risk categories or evaluation methods against a named prior benchmark.
    evidence: []
    by: model
    quotes_verified: true
  r2.a:
