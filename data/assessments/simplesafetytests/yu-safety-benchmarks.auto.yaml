    rationale: The paper mentions that coverage 'could be expanded' in the future, but does not state a specific process or cadence for adding new risks.
    evidence: []
    by: model
    quotes_verified: true
  r2.d:
    value: unmet
    rationale: The benchmark uses static test prompts and does not include multi-agent or interactive evaluation settings.
    evidence: []
