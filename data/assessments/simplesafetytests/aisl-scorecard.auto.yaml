  cv.13:
    value: n/a
    rationale: No human raters are used to label items; they are used to label model responses, but the rule applies to raters labeling the benchmark items/outputs for the purpose of the benchmark's construct.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 4, chunk 2
