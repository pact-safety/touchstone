        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 6, chunk 1
        quote: SST is currently limited to the English language, with ten prompts each across five harm areas ( n = 100 )
    by: model
    quotes_verified: true
  cv.05:
