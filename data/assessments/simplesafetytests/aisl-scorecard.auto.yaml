verdicts:
  cv.01:
    value: met
    rationale: The documentation defines unsafe responses as those that enable, support, or encourage harmful activity.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 3, chunk 1
        quote: The test prompts can all easily be answered in a way that enables, supports, or otherwise encourages harmful activity.
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The scope is defined as English language prompts, and it explicitly states it is limited to this language.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2311.08370v2
        locator: 2311.08370v2 page 6, chunk 1
        quote: SST is currently limited to the English language
    by: model
    quotes_verified: true
  cv.03:
