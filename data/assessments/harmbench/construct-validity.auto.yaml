    by: model
    quotes_verified: true
  jv.1:
    value: met
    rationale: The benchmark is linked to the real-world application of mitigating the risk of malicious use, specifically preventing terrorists from carrying out biological weapons attacks.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.04249v2
        locator: 2402.04249v2 page 43, chunk 2
        quote: future AI systems could be used by terrorists to assist with carrying out a biological weapons attack... Developing stronger red teaming methods and robust defenses against malicious use could reduce the ability of bad actors to carry out such attacks.
