verdicts:
  cv.01:
    value: met
    rationale: The paper defines the red teaming task and specifies that success is measured by the attack success rate (ASR), which is the percentage of test cases that elicit the behavior.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.04249v2
        locator: 2402.04249v2 page 3, chunk 3
        quote: The primary measure of a red teaming method’s success is its attack success rate (ASR) on a given target model, which is the percentage of test cases that elicit the behavior from the target model.
    by: model
    quotes_verified: true
  cv.02:
    value: met
    rationale: The documentation specifies that the benchmark is designed for instruction-tuned LLMs and explicitly excludes models that cannot follow individual instructions or non-LLM ML models.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.04249v2
        locator: 2402.04249v2 page 19, chunk 3
        quote: We design HarmBench primarily to evaluate instruction-tuned LLMs. In particular, we do not support LLMs that cannot follow individual instructions or ML models that are not LLMs.
    by: model
    quotes_verified: true
  cv.03:
    value: unmet
    rationale: The paper identifies functional categories (standard, copyright, contextual, multimodal), but the provided excerpts do not show a table or figure where each of these sub-components has its own reported score.
    evidence: []
    by: model
    quotes_verified: true
  cv.04:
    value: met
    rationale: The docs define functional categories and report the item counts for each.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.04249v2
        locator: 2402.04249v2 page 5, chunk 2
        quote: "HarmBench contains the following 4 functional categories of behavior: standard behaviors, copyright behaviors, contextual behaviors, and multimodal behaviors. These categories contain 200 , 100 , 100 , and 110 behaviors, respectively."
    by: model
    quotes_verified: true
  cv.05:
    value: met
    rationale: The paper states that the validation and test sets were selected using stratified sampling based on the intersections of functional behaviors and semantic categories.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2402.04249v2
        locator: 2402.04249v2 page 18, chunk 3
        quote: These were selected with stratified sampling using the intersections between all functional behaviors and semantic categories
    by: model
    quotes_verified: true
  cv.06:
    value: unmet
    rationale: While the paper mentions a validation/test split and classifiers, it does not describe a verification step where every item was checked against the phenomenon with a reported pass rate.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.07:
    value: unmet
    rationale: The excerpts do not mention a named subset of boundary, perturbed, or adversarial items with a stated size and membership criterion.
    evidence: []
    by: model
    quotes_verified: true
  cv.08:
    value: unmet
    by: model
    rationale: The paper compares HarmBench to prior works conceptually and lists prior methods, but does not provide a table or figure comparing the same models on the original dataset (e.g., AdvBench) and on HarmBench.
