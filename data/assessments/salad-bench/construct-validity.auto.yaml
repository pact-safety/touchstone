        url: https://arxiv.org/abs/2402.05044v4
        locator: 2402.05044v4 page 24, chunk 0
        quote: Some LLMs could make the right choices but fail to generate an accurate response format, such that the responses fail to be detected by the MCQ-Judge evaluator.
    by: model
    quotes_verified: true
  mo.3:
