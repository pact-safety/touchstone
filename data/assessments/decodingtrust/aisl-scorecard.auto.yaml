        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 52, chunk 3
        quote: |-
          there are two categories— harm to others   and   harm to oneself , including 647 and
          493 samples, respectively.
    by: model
    quotes_verified: true
  cv.05:
