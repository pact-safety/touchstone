verdicts:
  cv.01:
    value: met
    rationale: The benchmark provides an operational definition for model bias in the context of stereotypes, specifying that it is measured by the number of times a model agrees vs. disagrees with a stereotype statement.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 19, chunk 3
        quote: |-
          To evaluate the bias of GPT models, we check for   model agreeability : the number of times a model
          agrees vs. disagrees with a given stereotype statement in the user prompt.
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.02:
    value: unmet
    rationale: The documentation does not explicitly state what is excluded or not covered by the phenomenon's scope.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.03:
    value: unmet
    by: model
    rationale: The decision rule requires that every sub-component named for the phenomenon has its own reported score in a table or figure. While the paper reports aggregate bias scores and toxicity metrics, it does not provide independent scores for distinct facets of a single phenomenon (e.g., factual accuracy vs. tone) in a way that satisfies the 'independent score' requirement for all named facets. For example, stereotype bias is reported as an average across domains, not independently per domain in a way that isolates the facet scores for the construct validity check.
    evidence:
      - source: paper
        quote: We report the average bias score for all three stereotype domains as well as the overall average bias score, under both the NLI and QA setting.
        locator: 2306.11698v5 page 85, chunk 2
        url: https://arxiv.org/abs/2306.11698v5
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.04:
    value: met
    rationale: The docs define task categories (e.g., harm to others vs. self) and report item counts for these variations.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 52, chunk 3
        quote: |-
          there are two categories— harm to others   and   harm to oneself , including 647 and
          493 samples, respectively.
    by: model
    quotes_verified: true
  cv.05:
    value: met
    rationale: The documentation reports per-category item counts for the documented task space of immoral actions.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 52, chunk 3
        quote: there are three categories— minor harm ,   moderate harm , and   great harm , containing 656, 339, and 145 samples, respectively.
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.06:
    value: unmet
    rationale: There is no documented verification step with a pass rate or criteria for every item to ensure it tests the phenomenon.
    evidence: []
    by: model
    quotes_verified: true
  cv.07:
    value: unmet
    rationale: While adversarial prompts are mentioned, there is no named subset of boundary/adversarial items with a stated size and membership criterion.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.08:
    value: met
    rationale: The paper compares the performance of GPT models on the original AdvGLUE benchmark against a baseline from the AdvGLUE leaderboard.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 23, chunk 2
        quote: |-
          To better compare the evaluation results to the SoTA model on the AdvGLUE benchmark, we additionally include the
          results of the best model from the AdvGLUE leaderboard in Table 5
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.09:
    value: met
    rationale: The benchmark describes the creation of AdvGLUE++ as an extension to AdvGLUE to include attacks for autoregressive LLMs.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 21, chunk 4
        quote: |-
          We then introduce   AdvGLUE++ , an extension to the existing
          benchmark, which presents additional attacks catered to recent autoregressive LLMs
    by: model
    quotes_verified: true
  cv.10:
    value: unmet
    rationale: While item counts are provided for some tasks, there is no power calculation or confidence-interval half-width reported to justify statistical power.
    evidence: []
    by: model
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.11:
    value: unmet
    rationale: The main results tables (e.g., for bias or robustness) do not consistently provide confidence intervals or standard errors for every score.
    evidence: []
