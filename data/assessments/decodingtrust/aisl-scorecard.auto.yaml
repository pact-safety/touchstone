verdicts:
  cv.01:
    value: met
    rationale: The benchmark provides an operational definition for model bias in the context of stereotypes, specifying that it is measured by the number of times a model agrees vs. disagrees with a stereotype statement.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 19, chunk 3
        quote: |-
          To evaluate the bias of GPT models, we check for   model agreeability : the number of times a model
          agrees vs. disagrees with a given stereotype statement in the user prompt.
    by: model
    quotes_verified: true
  cv.02:
    value: unmet
    rationale: The documentation does not explicitly state what is excluded or not covered by the phenomenon's scope.
    evidence: []
    by: model
    quotes_verified: true
  cv.03:
    value: met
    rationale: The benchmark evaluates stereotype bias across different domains and reports scores for each, as well as an overall average.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 85, chunk 2
        quote: We report the average bias score for all three stereotype domains as well as the overall average bias score
    by: model
    quotes_verified: true
  cv.04:
    value: met
    rationale: The docs define task categories (e.g., harm to others vs. self) and report item counts for these variations.
    evidence:
