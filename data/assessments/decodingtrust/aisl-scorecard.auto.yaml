    value: unmet
    by: model
    rationale: While the paper measures model bias (e.g., stereotype bias, toxicity), it does not measure systematic biases in a *model rater* (e.g., length bias, position bias of the rater) nor does it state a mitigation for the rater's scoring behavior.
