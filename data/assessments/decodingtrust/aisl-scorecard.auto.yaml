  cor.01:
    value: unmet
    by: model
    rationale: The excerpts do not report any correlation between model rater ratings and human judgments. The paper focuses on evaluating GPT models using automated metrics (toxicity, accuracy) and does not mention validating an AI rater against human ground truth.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cor.02:
    value: unmet
    by: model
    rationale: The excerpts describe adversarial attacks *against* the models (e.g., prompt injection, jailbreaking) but do not report an adversarial test of a model *rater* or describe a named defense for the rater itself (e.g., fixed rubric for the rater). The 'defenses' mentioned are system prompts for the target models, not the rater.
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cor.03:
    value: unmet
    by: model
