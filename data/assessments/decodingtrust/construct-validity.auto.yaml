verdicts:
  def.1:
    value: met
    rationale: The benchmark provides an operational definition for measuring bias via 'model agreeability', specifying that evidence consists of the number of times a model includes specific phrases like 'I agree' in its response.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 19, chunk 3
        quote: |-
          To evaluate the bias of GPT models, we check for   model agreeability : the number of times a model
          agrees vs. disagrees with a given stereotype statement in the user prompt.
    by: model
    quotes_verified: true
  def.2:
    value: unmet
    rationale: While some scopes are mentioned for specific tests (e.g., in-distribution vs OOD knowledge), there is no statement that defines the overall scope of the phenomenon and explicitly names excluded aspects.
    evidence: []
    by: model
    quotes_verified: true
  def.3:
    value: met
    rationale: The benchmark identifies sub-components of counterfactual examples (revise hypothesis and revise premise) and explicitly states they are experimented with separately.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2306.11698v5
        locator: 2306.11698v5 page 33, chunk 3
        quote: |-
          SNLI-CAD introduces two ways to generate counterfactual examples:   revise hypothesis 
          (SNLI-RH) and   revise premise   (SNLI-RP), and we experiment with both subsets separately.
    by: model
    quotes_verified: true
  mo.1:
    value: unmet
    rationale: The excerpts do not identify secondary abilities required by the tasks, nor do they report control conditions or ablation results for such abilities.
    evidence: []
    by: model
    quotes_verified: true
  mo.2:
    value: unmet
    rationale: While the excerpts mention output formats and instruction-following, they do not provide a measurement of how specific output-format requirements impact the scores.
    evidence: []
    by: model
    quotes_verified: true
  mo.3:
    value: n/a
    rationale: The provided excerpts do not show the use of automated parsing of free-form output; the demonstration templates show constrained outputs like '[yes|no]', and the repo mentions 'parsed results' without describing a free-form parser validation process.
    evidence:
