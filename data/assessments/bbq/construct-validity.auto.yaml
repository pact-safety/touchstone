verdicts:
  def.1:
    value: met
    rationale: The paper defines the bias score as the observable output metric, specifically the percentage of non-UNKNOWN outputs that align with a social bias.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 1
        quote: The bias score reflects the percent of non- UNKNOWN outputs that align with a social bias.
    by: model
    quotes_verified: true
  def.2:
    value: met
    rationale: The scope is limited to a current US English-speaking cultural context, and it explicitly states that it does not include all possible social biases.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 9, chunk 3
        quote: These categories are limited to a current US English-speaking cultural context and do not include all possible social biases.
    by: model
    quotes_verified: true
  def.3:
    value: met
    rationale: The phenomenon is broken down into categories (e.g., Age, Gender identity) and the paper states that bias scores are calculated separately for different contexts.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 1
        quote: We calculate bias scores separately for the ambiguous and disambiguated contexts
    by: model
    quotes_verified: true
  mo.1:
    value: unmet
    rationale: The excerpts do not identify specific secondary abilities required by the tasks, nor do they report control conditions or ablation results for such abilities.
    evidence: []
    by: model
    quotes_verified: true
  mo.2:
    value: met
    rationale: The authors tested UnifiedQA using two different input formats (RACE-style and ARC-style) and reported the resulting accuracy.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 0
        quote: we include results for inputs with RACE-style (Lai et al., 2017) and ARC-style (Clark et al., 2018) formats
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 3
        quote: Overall accuracy on BBQ is highest for UnifiedQA with a RACE-style input format at 77.8%
    by: model
    quotes_verified: true
  mo.3:
    value: n/a
    rationale: The benchmark uses multiple-choice tasks where the model's top output is scored by exact match against answer options, rather than parsing free-form output.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 0
        quote: UnifiedQA outputs strings, so we score by exact match between the top output and each answer option.
    by: model
    quotes_verified: true
  ds.1:
    value: unmet
    rationale: The excerpts describe the categories of bias and the template construction, but they do not document a sampling strategy used to ensure the items are representative of the overall task space.
    evidence: []
    by: model
    quotes_verified: true
  ds.2:
    value: met
    rationale: The authors describe a validation process where items from each template are rated by annotators, and templates are edited and re-validated until they pass a 4/5 agreement threshold.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 5, chunk 4
        quote: If any of the items from a template fall below threshold, that template is edited and all four associated items are re-validated until it passes.
    by: model
    quotes_verified: true
  ds.3:
    value: unmet
    rationale: While the authors test different input formats (RACE-style and ARC-style), there is no mention of a counted subset of permuted or perturbed items with results reported separately from the main score.
    evidence: []
    by: model
    quotes_verified: true
  ru.1:
    value: met
    rationale: The documentation explicitly states that the dataset was constructed by the authors, while also noting that specific labels were adapted from other sources.
    evidence:
      - source: repo
        url: https://github.com/nyu-mll/BBQ/tree/bea11bd97d79217245b5871acd247b9d6eb24598
        locator: nyu-mll/BBQ@bea11bd97d79:README.md, chunk 0
        quote: We introduce the Bias Benchmark for QA (BBQ), a dataset of question sets constructed by the authors
    by: model
    quotes_verified: true
  ru.2:
    value: unmet
    rationale: While the text mentions adapting nationality labels from UnQover, it does not report the strengths and limitations of that prior work.
    evidence: []
    by: model
    quotes_verified: true
  ru.3:
    value: unmet
    rationale: There is no comparison of performance between the new BBQ benchmark and the original datasets from which labels were adapted.
    evidence: []
    by: model
    quotes_verified: true
  ru.4:
    value: unmet
    rationale: The text mentions adding regional classifications to adapted nationality labels, but it does not explain how this specific modification improves construct validity.
    evidence:
