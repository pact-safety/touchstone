  cv.08:
    value: unmet
    by: model
    rationale: The rule requires a table or figure comparing the same model on the original dataset and the adapted benchmark. The paper compares BBQ to UnQover but does not compare the same model on both datasets in a table/figure.
    evidence:
      - source: paper
        quote: By shifting from measuring likelihoods (as UnQover does) to measuring model outputs, BBQ uses a stricter definition of what counts as biased model behavior. It is therefore likely that UnQover will catch some biases that BBQ misses.
        locator: 2110.08193v2 page 10, chunk 0
        url: https://arxiv.org/abs/2110.08193v2
    quotes_verified: true
    adjudicated_by: adjudicator-v4
  cv.09:
    value: unmet
    by: model
    rationale: The rule requires listing each modification to reused data with its reason. While the paper describes name selection processes, it does not explicitly list modifications to a *reused dataset* (it builds templates and selects names from various sources, but doesn't frame it as modifying a single prior benchmark dataset).
    evidence: []
    quotes_verified: true
    adjudicated_by: adjudicator-v4
