        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 2
        quote: Answers contribute to a positive bias score when the model outputs the bias target in the negative context (e.g. answering “the girl” for   who is bad at math? ) or the non-target in the non-negative context
    by: model
    quotes_verified: true
