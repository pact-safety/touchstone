  cv.14:
    value: met
    rationale: The labels are subjective (human validation of gold labels), and the docs report a Krippendorf's alpha statistic for agreement.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 0
