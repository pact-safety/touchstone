verdicts:
  des.01:
    value: 15
    rationale: The benchmark defines its focus as stereotyping behavior and the manifestation of social biases in QA outputs.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 1, chunk 3
        quote: we focus on stereotyping behavior and build on the definition and treatment of bias in QA from Li et al. (2020)
    by: model
    quotes_verified: true
  des.02:
    value: 15
    rationale: The benchmark translates the concept of bias into a task using under-informative and adequately informative contexts to test if biases override correct answers.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 1, chunk 0
        quote: "Our task evaluates model responses at two levels: (i) given an under-informative context, we test how strongly responses reflect social biases, and (ii) given an adequately informative context, we test whether the model’s biases override a correct answer choice."
    by: model
    quotes_verified: true
  des.03:
    value: 15
    rationale: The authors describe how these biases in real-world applications risk harming marginalized individuals and groups.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 1, chunk 1
        quote: The use of these models in real-world applications therefore risks harming marginalized individuals and groups.
    by: model
    quotes_verified: true
  des.04:
    value: 15
    rationale: The authors explicitly warn that a low bias score should not be interpreted as the model being unbiased in all cases.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 9, chunk 3
        quote: We do not intend that a low bias score should be indicative of a less biased model in all cases.
    by: model
    quotes_verified: true
