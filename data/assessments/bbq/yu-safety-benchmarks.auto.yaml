verdicts:
  r1.a:
    value: met
    rationale: The benchmark identifies social biases as the risk type and specifies accuracy and a 'bias score' as the measurement methods.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 1, chunk 0
        quote: highlight attested social biases against people belonging to protected classes
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 6, chunk 1
        quote: we introduce a bias score to quantify the degree to which a model systematically answers questions in a biased way
    by: model
    quotes_verified: true
  r1.b:
    value: met
    rationale: The benchmark states it does not cover all social biases and assumes a US English-speaking cultural context.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 9, chunk 3
        quote: These categories are limited to a current US English-speaking cultural context and do not include all possible social biases.
    by: model
    quotes_verified: true
  r1.c:
    value: met
    rationale: The text explicitly warns that a low bias score should not be interpreted as the model being unbiased in all cases.
    evidence:
      - source: paper
        url: https://arxiv.org/abs/2110.08193v2
        locator: 2110.08193v2 page 9, chunk 3
        quote: We do not intend that a low bias score should be indicative of a less biased model in all cases.
    by: model
    quotes_verified: true
  r1.d:
    value: met
    by: model
    rationale: The benchmark compares its coverage and method against the prior benchmark UnQover, stating a difference in evaluation method (outputs vs likelihoods).
    evidence:
      - source: paper
        quote: By shifting from measuring likelihoods (as UnQover does) to measuring model outputs, BBQ uses a stricter definition of what counts as biased model behavior.
        locator: 2110.08193v2 page 10, chunk 0
        url: https://arxiv.org/abs/2110.08193v2
    quotes_verified: true
    adjudicated_by: adjudicator-v4
