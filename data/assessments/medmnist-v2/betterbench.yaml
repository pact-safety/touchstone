  des.01:
    value: 15
    rationale: "The authors state: 'In this study, we aim at a new “decathlon” dataset for biomedical image analysis, named MedMNIST v2. As illustrated in Fig. 1, MedMNIST v2 is a large-scale benchmark for 2D and 3D biomedical image classifcation, covering 12 2D datasets with 708,069 images and 6 3D datasets with 9,998 images.'"
    evidence:
      - source: website
        url: https://betterbench.stanford.edu/database.html
        locator: BetterBench database entry "MedMNIST v2", Design criterion 1
    by: human
  des.02:
    value: 15
    rationale: This is covered on Page 2.
    evidence:
      - source: website
        url: https://betterbench.stanford.edu/database.html
        locator: BetterBench database entry "MedMNIST v2", Design criterion 2
    by: human
  des.03:
    value: 10
    rationale: Although the paper refers to the dataset's utility for benchmarking models ('a large but simple dataset focusing on the machine learning part like VDD, rather than the end-to-end system like MSD, will serve as a better benchmark to evaluate the generalization performance of the machine learning algorithms on the medical image analysis tasks') it does not explicitly state why such comparisons are useful.
    evidence:
      - source: website
        url: https://betterbench.stanford.edu/database.html
        locator: BetterBench database entry "MedMNIST v2", Design criterion 3
    by: human
