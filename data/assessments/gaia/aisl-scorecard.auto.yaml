      - source: paper
        url: https://arxiv.org/abs/2311.12983v1
        locator: 2311.12983v1 page 4, chunk 0
        quote: GAIA   is a benchmark for AI systems proposing general assistant questions.
      - source: paper
        url: https://arxiv.org/abs/2311.12983v1
        locator: 2311.12983v1 page 4, chunk 1
        quote: The questions are designed to admit a short, single correct answer, therefore easy to verify.
    by: model
    quotes_verified: true
