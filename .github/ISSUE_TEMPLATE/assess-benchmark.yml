name: Ask for a benchmark to be assessed
description: Add a benchmark that Touchstone doesn't rate yet.
title: "Assess: "
labels: [assessment-request]
body:
  - type: input
    id: name
    attributes:
      label: Benchmark name
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper
      description: arXiv link if there is one
  - type: input
    id: repo
    attributes:
      label: Code repository
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Who relies on it, for example in model cards or policy documents.
