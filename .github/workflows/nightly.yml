name: Nightly re-assessment
# Checks every benchmark's paper version and repo commit, re-assesses what changed (or was never
# assessed) with an open-weights model, and opens a pull request. Nothing is published until a
# person reviews and merges it. By default the model runs on this runner with Ollama, so no account
# or key is needed. To use a hosted OpenAI-compatible provider instead, set the repository variable
# TOUCHSTONE_LLM_BASE_URL, the variable TOUCHSTONE_MODEL, and the secret TOUCHSTONE_LLM_API_KEY.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: Most model calls this run may make
        default: '12'
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  reassess:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OLLAMA_VERSION: '0.40.1'
      # Room for prompt + excerpts + answer; Ollama's default context (4096) would silently truncate.
      OLLAMA_CONTEXT_LENGTH: '16384'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check sources for changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx src/cli.ts watch --write | tee watch.json
      - name: Free disk space for model weights
        if: vars.TOUCHSTONE_LLM_BASE_URL == ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Start Ollama (pinned) and pull the model
        if: vars.TOUCHSTONE_LLM_BASE_URL == ''
        env:
          MODEL: ${{ vars.TOUCHSTONE_MODEL || 'qwen3:8b' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull "$MODEL"
          ollama list
          free -h
      - name: Assess changed and unassessed pairs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOUCHSTONE_LLM_BASE_URL: ${{ vars.TOUCHSTONE_LLM_BASE_URL }}
          TOUCHSTONE_LLM_API_KEY: ${{ secrets.TOUCHSTONE_LLM_API_KEY }}
          TOUCHSTONE_MODEL: ${{ vars.TOUCHSTONE_MODEL }}
          MAX_CALLS: ${{ inputs.max_calls || vars.TOUCHSTONE_MAX_CALLS || '12' }}
        run: npx tsx src/cli.ts assess --queue --max-calls "$MAX_CALLS"
      - name: Keep transcripts of incomplete runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incomplete-runs
          path: runs-failed/
          if-no-files-found: ignore
          retention-days: 30
      - run: npx tsx src/cli.ts validate
      - run: npm test
      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git status, not git diff: new assessment files are untracked.
          if [ -z "$(git status --porcelain -- data/assessments data/runs)" ]; then
            echo "No new or changed assessments; nothing to review."; exit 0
          fi
          branch="nightly/$(date -u +%F)-$GITHUB_RUN_ID"
          git config user.name "touchstone-bot"
          git config user.email "touchstone-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add data/assessments data/runs data/watch
          git commit -m "Nightly re-assessment $(date -u +%F)"
          git push -u origin "$branch"
          cat > pr-body.md <<'BODY'
          The nightly job found new or changed benchmark sources and proposed verdicts with an open-weights model.

          **Before merging**, for each changed `*.auto.yaml`:
          - read the rationale and quoted evidence for each verdict (every quote was verified verbatim against the pinned source);
          - override any verdict you disagree with by setting `by: human` and a rationale;
          - set `status: published` and add yourself to `provenance.reviewers`, or leave it as a draft.

          Transcripts are in `data/runs/`. Run `npx tsx src/cli.ts replay --benchmark <id> --standard <id>` to check the sources and prompts match the record.
          BODY
          title="Nightly re-assessment $(date -u +%F)"
          if gh pr create --title "$title" --label automated-assessment --body-file pr-body.md; then exit 0; fi
          # If the organization blocks Actions from opening pull requests, hand off through an issue instead:
          # one click on the compare link opens the same PR from a person's account.
          compare="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          { echo "**Pull requests from Actions are blocked by organization policy**, so this run is handed off as an issue."; echo; echo "[Open the pull request]($compare) for branch \`$branch\`, then review it as below."; echo; cat pr-body.md; } > issue-body.md
          gh issue create --title "$title: ready for review" --label automated-assessment --body-file issue-body.md
