name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx src/cli.ts validate
      - run: npm test
      - name: Every verdict change has a revision entry (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx src/cli.ts check-revisions --base "origin/$BASE_REF"
      - name: Every verdict change has a revision entry (push to main)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "${BEFORE//0/}" ]; then
            echo "New branch; no base to compare against."; exit 0
          fi
          npx tsx src/cli.ts check-revisions --base "$BEFORE"
      - name: Site builds, and the data build is reproducible
        run: |
          npm run build
          cp -r site/public/data /tmp/first-data
          npx tsx src/cli.ts build --out site/public/data
          diff -r /tmp/first-data site/public/data
